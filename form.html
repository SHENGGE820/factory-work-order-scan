<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工廠管理</title>
<link rel="icon" href="icons/icon-192.png">
<style>
/* Desktop table for the 五股廠(生產組) sheet of BKE在途工單. Every work order of the plan sheet is a row. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d5dce3; --auto-bg:#eaf2fb;
  --accent:#f2c200; --go:#1d8a4c; --go-bg:#e2f3e9; --stop:#c43a2f; --warn-bg:#fff4cc; --warn-ink:#6b5200;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e6ebf0; --muted:#97a4b2; --line:#2c3843; --auto-bg:#1b2b3b;
  --go:#2fa866; --go-bg:#13301f; --stop:#e05547; --warn-bg:#3a3110; --warn-ink:#f3dc8a; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:14px;line-height:1.4;padding:12px}
.wrap{max-width:none;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
a{color:inherit}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px}
input:focus-visible,select:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.btn{cursor:pointer;font:inherit;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 14px;min-height:34px}
.btn-go{background:var(--go);border-color:var(--go);color:#fff}
.btn-mini{font-size:12px;font-weight:600;padding:2px 8px;min-height:24px;color:var(--stop);border-color:var(--stop)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:8px 12px;border-radius:8px;font-weight:600}
.msg.err{background:var(--warn-bg);color:var(--warn-ink)}
.msg.ok{background:var(--go-bg);color:var(--go)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{width:240px}
.note{font-size:13px;color:var(--muted);margin:0}
.legend{display:inline-block;padding:0 8px;border-radius:4px;background:var(--auto-bg);border:1px solid var(--line)}
.tablewrap{overflow:auto;max-height:calc(100vh - 190px);border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
th,td{padding:3px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle;white-space:nowrap;background:var(--surface)}
th{position:sticky;top:0;z-index:2;font-size:12px;color:var(--muted);font-weight:600;text-align:left}
th.auto{background:var(--auto-bg)}
td.auto{background:var(--auto-bg)}
.s0,.s1{position:sticky;z-index:1}
th.s0,th.s1{z-index:4}
.s0{left:0;min-width:140px;max-width:140px}
.s1{left:140px;min-width:210px;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.grip{cursor:grab;user-select:none;padding:0 4px;font-size:16px;color:var(--muted)}
.mv{all:unset;cursor:pointer;font-size:11px;line-height:1;padding:4px 3px;color:var(--muted);border-radius:4px}
.mv:hover{background:var(--line);color:var(--ink)}
.mv:focus-visible{outline:2px solid var(--accent)}
.grip{touch-action:none}
tr.sec td{background:#000;color:#fff;font-size:16px;font-weight:700;padding:8px 14px;cursor:pointer;border-right:0}
tr.sec .lab{position:sticky;left:14px;display:inline-block}
tr.sec .cnt{font-weight:400;opacity:.75;font-size:13px}
tr.lifted{position:relative;z-index:6}
tr.lifted td{background:var(--surface);box-shadow:0 10px 22px rgba(0,0,0,.22);border-top:1px solid var(--accent);border-bottom:1px solid var(--accent)}
tr.lifted .grip{color:var(--accent)}
.grip:hover{color:var(--ink)}
body.dragging-rows{cursor:grabbing;user-select:none}
body.dragging-rows *{cursor:grabbing!important}
td.over{color:#fff;background:var(--stop)!important;font-weight:700}
tr.saved td.s0{box-shadow:inset 3px 0 0 var(--go)}
tr.done td{opacity:.6}
td select,td input[type=text],td input[type=number],td input[type=date]{border-color:transparent;background:transparent}
tr:hover td select,tr:hover td input,td select:focus,td input:focus{border-color:var(--line);background:var(--surface)}
td select{width:100%;min-width:84px}
td input[type=text],td input[type=number],td input[type=date]{width:100%;min-width:84px}
td input[type=number]{min-width:64px;width:72px}
td input[type=checkbox]{width:18px;height:18px;min-height:0}
td input.ro{cursor:default;accent-color:var(--go)}
td.chk{text-align:center}
.status{min-width:70px;font-size:12px;color:var(--muted)}
.status .btn-mini{visibility:hidden}
tr:hover .status .btn-mini{visibility:visible}
.status.bad{color:var(--stop);font-weight:700}
.status.good{color:var(--go)}
tr.sec.empty td{background:var(--bg);color:var(--muted);font-size:14px;padding:5px 14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>工廠管理 <small class="note">五股廠(生產組)・粉包</small></h1>
    <span><a href="report.html">主管報表</a>・<a href="index.html">掃碼 App</a></span>
  </header>

  <section class="panel" id="pinPanel" hidden>
    <label for="pinInput">請輸入工廠密碼（和掃碼 App 同一組，只需輸入一次）</label>
    <div class="row-actions"><input id="pinInput" type="password" autocomplete="off" style="max-width:240px"><button class="btn btn-go" id="pinGo">確定</button></div>
  </section>

  <div id="msg" class="msg" hidden></div>

  <section class="panel" id="listPanel" hidden>
    <div class="tools">
      <input id="q" type="search" placeholder="搜尋工令單號、品名、人員">
      <select id="machineFilter" aria-label="機台"><option value="">全部機台</option></select>
      <select id="statusFilter" aria-label="狀態">
        <option value="open">未完工</option><option value="all">全部</option>
        <option value="unassigned">還沒排機台</option><option value="assigned">已排機台</option><option value="done">已完工</option>
      </select>
      <button class="btn" id="reloadBtn">重新讀取</button>
      <span class="note" id="summary"></span>
    </div>
    <p class="note" id="tableNote"><span class="legend">淺藍底</span> 是自動帶的（計畫單平台、手機計時），不用填；製造日期、完工時間、生產進度、實際用時也會被手機計時自動填上。其他格子直接點了填，會自動存。按住最左邊 ⠿ 上下拖可以排順序，拖到別的大分類底下就換分類；機台直接在「機台」欄選。</p>
    <div class="tablewrap" id="tableView">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="row-actions"><button class="btn" id="moreBtn" hidden>顯示更多</button></div>
  </section>
</div>

<script src="config.js"></script>
<script>
const API = window.APP_CONFIG?.sheetApi || "";
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const $ = id => document.getElementById(id);
// Column order. auto: filled from the plan sheet (not typed). Dropdown lists (opt) come from the backend because they hold staff names.
const COLS = [
  // sticky on the left so the order stays visible while scrolling
  {id:"no", label:"工令單號", auto:true, s:0},
  {id:"name", label:"產品名稱", auto:true, s:1},
  // then the same order as the 五股廠(生產組) sheet: people, machine, dates, progress ...
  {k:"作業人員1", label:"作業人員 1", t:"select", opt:"作業人員"},
  {k:"作業人員2", label:"作業人員 2", t:"select", opt:"作業人員"},
  {k:"作業人員3", label:"作業人員 3", t:"select", opt:"作業人員"},
  {k:"作業人員4", label:"作業人員 4", t:"select", opt:"作業人員"},
  {id:"people", label:"人數", auto:true},
  {k:"機台", t:"select", opt:"機台"},
  {k:"預計完工日", t:"select", opt:"預計完工日"},
  {k:"天/時", t:"select", opt:"天/時"},
  {k:"製造日期", t:"date"},
  {k:"生產進度", t:"number"},
  {k:"完工時間", t:"date"},
  {k:"實際用時(時)", label:"實際用時(時)", t:"number"},
  {k:"實際用時(分)", label:"實際用時(分)", t:"number"},
  // filled in by the phone timer (工時紀錄): shown, not typed
  {id:"tPrep", label:"前置(分)", auto:true, sv:"前置(分)"},
  {id:"tRun", label:"上機(分)", auto:true, sv:"上機(分)"},
  {id:"tStop", label:"停機(分)", auto:true, sv:"停機(分)"},
  {id:"tLoss", label:"損耗", auto:true, sv:"損耗"},
  {id:"tAllow", label:"可損耗", auto:true, sv:"可損耗"},
  {k:"進度說明", t:"select", opt:"進度說明"},
  // ... then the right half of the sheet
  {k:"出貨點", t:"text", list:["出貨客戶","五股包裝"]},
  {id:"due", label:"交期", auto:true},
  {id:"code", label:"產品編號", auto:true, mono:true},
  {id:"qty", label:"數量", auto:true},
  {id:"unit", label:"單位", auto:true},
  {k:"答交", t:"text"},
  {k:"作業時間", t:"text"},
  {id:"pickNo", label:"領料單號/調撥單號", auto:true, mono:true},
  {id:"arrive", label:"到料時間", auto:true},
  {id:"picked", label:"領料", auto:true, check:true},
  {id:"doneFlag", label:"工令完工", auto:true, check:true},
  {k:"備註", t:"text", wide:true},
  {k:"完工資訊", t:"text"},
  {id:"parent", label:"上階工單", auto:true, mono:true},
  {id:"semi", label:"半成品完工", auto:true, check:true},
  {id:"status", label:"狀態"},
];
let pin = store.get("pin",""), options = {}, orders = [], planOf = new Map(), saved = new Map(), limit = 400, queue = Promise.resolve();
const timers = new Map(), pending = new Set();
// 品項 that actually appear in the 五股廠(生產組) sheet (checked 2026-10-14 against 訂單計畫單: 289 of 777 orders; packaging items such as 盒/袋裝/5包裝 never do).
const TRANSIT_ITEMS = ["7混料","4三面封粉包","4粉包"];   // powder first; capsule items (4膠囊, 4打排, 2換膠囊) are hidden for now
const CAPSULE = /膠囊|打排/;                              // items and machines of the capsule line, hidden everywhere (rows already filled in stay)

function say(text, cls="err"){const m=$("msg");m.className="msg "+cls;m.textContent=text;m.hidden=!text}
const ERR = {bad_pin:"工廠密碼不正確。", not_configured:"後端還沒設定密碼。", bad_format:"工令單號格式不對。", not_found:"訂單計畫單查不到這個工令單號。", row_missing:"這筆資料已經不存在，請重新整理。", bad_request:"送出的資料有問題。"};
async function request(fn){
  try{
    const res = await fn();
    if(res.ok) return res;
    if(res.error==="bad_pin"){store.set("pin","");pin="";showPin()}
    say(ERR[res.error]||"發生錯誤："+res.error); return null;
  }catch(e){say("連不上伺服器，請確認網路後再試。"); return null}
}
const get = params => request(async()=>(await fetch(API+"?"+new URLSearchParams({pin,...params}))).json());
// text/plain keeps this a "simple" request, so the browser needs no CORS preflight against Apps Script
const post = body => request(async()=>(await fetch(API,{method:"POST",body:JSON.stringify({pin,...body})})).json());

function showPin(){$("pinPanel").hidden=false;$("listPanel").hidden=true;$("pinInput").focus()}
$("pinGo").onclick=()=>{const v=$("pinInput").value.trim();if(!v)return;pin=v;store.set("pin",v);$("pinInput").value="";$("pinPanel").hidden=true;say("");start()};
$("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("pinGo").click()});

// ---- rows ----
const isDone = (plan,s) => !!(plan?.done || s?.["進度說明"]==="完工");   // 工令完工 ticked in 計畫單平台, or marked 完工 here
const keyOf = new Map(), viewList = [];
function allRows(){
  const seen=new Set(), out=[];
  for(const o of orders){if(seen.has(o.no))continue;seen.add(o.no);out.push({no:o.no,plan:o,saved:saved.get(o.no)||null})}
  for(const [no,r] of saved) if(!seen.has(no)) out.push({no,plan:null,saved:r});   // saved earlier, order has left the plan sheet
  // Rows that were dragged have a saved 排序 number; the others follow, newest order number first.
  const num=r=>parseFloat(r.saved?.["排序"]);
  const plain=out.filter(r=>!Number.isFinite(num(r))).sort((a,b)=>b.no.slice(1).localeCompare(a.no.slice(1))||a.no.localeCompare(b.no));
  keyOf.clear(); plain.forEach((r,i)=>keyOf.set(r.no,1e9+i));
  for(const r of out) if(Number.isFinite(num(r))) keyOf.set(r.no,num(r));
  return out.sort((a,b)=>keyOf.get(a.no)-keyOf.get(b.no));
}
const peopleOf = r => [1,2,3,4].map(i=>r?.["作業人員"+i]).filter(Boolean);

// Big sections of the 五股廠(生產組) sheet = the line an order runs on. A product's mixing order sits next to its packing order.
// 加大型 starts empty: people drag rows into it. Capsule lines are a separate project and stay hidden.
const SECTIONS=[{id:"std",name:"標準型粉包機 5台"},{id:"big",name:"加大型粉包機 1台"},{id:"mix",name:"混料"}];
const POWDER=["4三面封粉包","4粉包"];
let collapsed=new Set(store.get("collapsed",[]));
function defaultSection(r){
  const item=r.plan?.item||"";
  if(CAPSULE.test(item)) return "capsule";
  if(POWDER.includes(item)) return "std";
  if(item==="7混料"){                                       // follow the neighbouring work order (pack N, mix N+1) when there is one
    const n=Number(r.no.slice(1));
    for(const d of [-1,1]){const o=planOf.get(r.no[0]+String(n+d)); if(o){ if(POWDER.includes(o.item)) return "std"; if(CAPSULE.test(o.item)) return "capsule" }}
    return "mix";
  }
  return "std";
}
const sectionOf=r=>SECTIONS.some(x=>x.id===r.saved?.["分區"])?r.saved["分區"]:defaultSection(r);
function visibleRows(){
  const item="__transit", q=$("q").value.trim().toLowerCase(), mc=$("machineFilter").value, st=$("statusFilter").value;
  return allRows().filter(r=>{
    const s=r.saved;
    if(!s&&defaultSection(r)==="capsule") return false;      // capsule line: hidden for now
    if(item==="__transit"){if(!s&&!TRANSIT_ITEMS.includes(r.plan?.item)) return false}   // rows already filled in stay visible
    else if(item&&r.plan?.item!==item) return false;
    if(mc&&s?.["機台"]!==mc) return false;
    if(st==="open"&&isDone(r.plan,s)) return false;
    if(st==="done"&&!isDone(r.plan,s)) return false;
    if(st==="unassigned"&&s?.["機台"]) return false;
    if(st==="assigned"&&!s?.["機台"]) return false;
    if(!q) return true;
    return [r.no,r.plan?.name||s?.["產品名稱"],r.plan?.code,peopleOf(s).join(" ")].join(" ").toLowerCase().includes(q);
  });
}

function makeInput(c, r){
  const k=c.k; let v=r.saved?.[k]??""; if(!v&&c.plan) v=r.plan?.[c.plan]||"";
  let el;
  if(c.t==="select"&&options[c.opt]?.length){
    el=document.createElement("select"); el.append(new Option("",""));
    for(const o of options[c.opt]) el.append(new Option(o,o));
    if(v&&!options[c.opt].includes(v)) el.append(new Option(v,v));   // keep a saved value that left the dropdown list
    el.value=v;
  }else if(c.t==="check"){
    el=document.createElement("input"); el.type="checkbox"; el.checked=v==="是";
  }else{
    el=document.createElement("input"); el.type=c.t==="number"?"number":c.t==="date"?"date":"text";
    if(c.t==="number") el.step="any";
    if(c.upper) el.style.textTransform="uppercase";
    if(c.list){el.setAttribute("list","dl-"+k)}
    el.value=v;
  }
  el.dataset.k=k; if(c.t==="check") el.setAttribute("aria-label",k);
  return el;
}
function buildRow(r){
  const tr=document.createElement("tr"); tr.dataset.no=r.no; tr.dataset.sec=sectionOf(r); if(r.saved) tr.className="saved"; if(isDone(r.plan,r.saved)) tr.classList.add("done");
  const name=r.plan?.name||r.saved?.["產品名稱"]||"", code=r.plan?.code||r.saved?.["產品編號"]||"";
  for(const c of COLS){
    const td=document.createElement("td"); if(c.auto) td.classList.add("auto"); if(c.s!=null) td.classList.add("s"+c.s);
    if(c.id==="no"){td.className+=" mono";
      const grip=document.createElement("span");grip.className="grip";grip.dataset.grip="1";grip.textContent="⠿";grip.title="按住往上或往下拖，調整順序";
      const mk=(t,d,title)=>{const b=document.createElement("button");b.className="mv";b.textContent=t;b.dataset.move=d;b.title=title;b.setAttribute("aria-label",title);return b};
      td.append(grip,document.createTextNode(" "+r.no));
      if(r.plan?.rework){const t=document.createElement("small");t.textContent=" 重工";t.style.color="#b54708";td.append(t)}}
    else if(c.id==="name"){td.textContent=name;td.title=name}
    else if(c.id==="qty"){td.textContent=r.plan?.qty??r.saved?.["數量"]??"";td.style.textAlign="right"}
    else if(c.id==="unit") td.textContent=r.plan?.unit??r.saved?.["單位"]??"";
    else if(c.id==="item") td.textContent=r.plan?.item||"";
    else if(c.id==="code"){td.className+=" mono";td.textContent=code}
    else if(c.check){td.className+=" chk";   // checkboxes of 計畫單平台: shown as real, read-only ticks
      const on=c.id==="picked"?r.plan?.picked:c.id==="doneFlag"?r.plan?.done:/^(TRUE|是|✔|V)$/i.test(r.plan?.semi||"");
      const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!on; cb.className="ro"; cb.tabIndex=-1;
      cb.title="來自計畫單平台（要改請到計畫單平台）"; cb.setAttribute("aria-label",c.label+(on?"：是":"：否")); cb.addEventListener("click",e=>e.preventDefault());
      td.append(cb)}
    else if(c.sv){td.dataset.sv=c.sv;td.style.textAlign="right";fillTimer(td,r.saved)}
    else if(c.auto&&c.id!=="people"&&c.id!=="status"){td.textContent=r.plan?.[c.id]||"";if(c.mono)td.className+=" mono"}
    else if(c.id==="people"){td.dataset.people="1";td.style.textAlign="center";td.textContent=peopleOf(r.saved).length||""}
    else if(c.id==="status"){td.className+=" status";setStatus(td,r.saved?"good":"",r.saved?"✓":"");if(r.saved)td.title="已存 "+r.saved["更新時間"].slice(5,16);
      if(r.saved){const b=document.createElement("button");b.className="btn btn-mini";b.textContent="清除";b.title="清除這張單填過的資料（計畫單平台不受影響）";b.dataset.clear=r.no;td.append(" ",b)}}
    else{td.append(makeInput(c,r)); if(c.t==="check") td.classList.add("chk")}
    tr.append(td);
  }
  return tr;
}
// Timer columns; 損耗 turns red once it is over 可損耗 (order quantity × 3%).
function fillTimer(td,row){
  const v=row?.[td.dataset.sv]??""; td.textContent=v;
  if(td.dataset.sv==="損耗"){const over=v!==""&&row["可損耗"]!==""&&Number(v)>Number(row["可損耗"]); td.classList.toggle("over",over); td.title=over?"已超過可損耗":""}
}
function setStatus(td,cls,text){td.className="status"+(cls?" "+cls:"");td.textContent=text}

function headerRow(cls,sec,mach,label){
  const tr=document.createElement("tr"); tr.className=cls; tr.dataset.sec=sec; if(mach!=null) tr.dataset.mach=mach;
  const td=document.createElement("td"); td.colSpan=COLS.length;
  const lab=document.createElement("span"); lab.className="lab";
  if(cls==="sec"){const t=document.createElement("span");t.className="tog";lab.append(t," ")}
  lab.append(label," ");const n=document.createElement("span");n.className="cnt";lab.append(n);
  td.append(lab); tr.append(td); return tr;
}
const rowIn=(r,id)=>{const t=buildRow(r);t.dataset.sec=id;return t};   // a row always carries the section it is shown in
function render(){
  const rows=visibleRows(), body=$("rows"); body.textContent=""; viewList.length=0; viewList.push(...rows);
  const shown=rows.slice(0,limit), bySec=new Map(SECTIONS.map(x=>[x.id,[]]));
  for(const r of shown) (bySec.get(sectionOf(r))||bySec.get("mix")).push(r);
  const frag=document.createDocumentFragment();
  for(const sec of SECTIONS){
    frag.append(headerRow("sec",sec.id,null,sec.name));
    for(const r of bySec.get(sec.id)) frag.append(rowIn(r,sec.id));
  }
  body.append(frag); applyCollapsed(); refreshCounts();
  $("summary").textContent="顯示 "+Math.min(limit,rows.length)+" / 符合 "+rows.length+" 張・計畫單平台（五股廠）共 "+orders.length+" 張・已填 "+saved.size+" 張";
  $("moreBtn").hidden=rows.length<=limit; $("moreBtn").textContent="顯示更多（還有 "+(rows.length-limit)+" 張）";
}
function applyCollapsed(){
  for(const tr of $("rows").children){
    if(tr.classList.contains("sec")) tr.querySelector(".tog").textContent=collapsed.has(tr.dataset.sec)?"▸":"▾";
    else tr.hidden=collapsed.has(tr.dataset.sec);
  }
}
function refreshCounts(){                                   // number of rows on each section bar
  let sec=null, n=0;
  const flush=()=>{if(sec){sec.querySelector(".cnt").textContent="（"+n+"）";sec.classList.toggle("empty",!n)}};
  for(const tr of $("rows").children){ if(tr.classList.contains("sec")){flush();sec=tr;n=0} else n++ }
  flush();
}
function buildHead(){
  const h=$("head"); h.textContent="";
  for(const c of COLS){const th=document.createElement("th"); th.textContent=c.label||c.k; if(c.auto) th.classList.add("auto"); if(c.s!=null) th.classList.add("s"+c.s); h.append(th)}
  for(const c of COLS) if(c.list&&!document.getElementById("dl-"+c.k)){const dl=document.createElement("datalist");dl.id="dl-"+c.k;for(const v of c.list)dl.append(new Option(v));document.body.append(dl)}
}
function buildFilters(){
  const fill=(sel,vals,keep=1)=>{const cur=sel.value;sel.length=keep;for(const v of vals)sel.append(new Option(v,v));sel.value=cur&&[...sel.options].some(o=>o.value===cur)?cur:sel.options[0].value};
  fill($("machineFilter"),options["機台"]||[...new Set([...saved.values()].map(r=>r["機台"]).filter(Boolean))]);
}
let rt=null; for(const id of ["q","machineFilter","statusFilter"]) $(id).addEventListener("input",()=>{clearTimeout(rt);limit=400;rt=setTimeout(refresh,id==="q"?250:0)});
$("moreBtn").onclick=()=>{limit+=200;render()};
$("reloadBtn").onclick=()=>start(true);

// ---- editing: every change saves its row (rows are keyed by 工令單號) ----
function collect(tr){
  const row={};
  for(const el of tr.querySelectorAll("[data-k]")) row[el.dataset.k]=el.type==="checkbox"?(el.checked?"是":""):el.value.trim();
  if(row["領料單號/調撥單號"]) row["領料單號/調撥單號"]=row["領料單號/調撥單號"].toUpperCase();
  return row;
}
function updatePeople(tr){
  const n=[...tr.querySelectorAll('[data-k^="作業人員"]')].filter(e=>e.value).length;
  tr.querySelector("[data-people]").textContent=n||"";
}
function statusCell(tr){return tr.querySelector("td.status")}
function schedule(tr){
  const no=tr.dataset.no; setStatus(statusCell(tr),"","…等待儲存"); clearTimeout(timers.get(no)); pending.add(no);
  timers.set(no,setTimeout(()=>{queue=queue.then(()=>saveRow(tr)).finally(()=>pending.delete(no))},500));
}
async function saveRow(tr){
  const no=tr.dataset.no, td=statusCell(tr); setStatus(td,"","儲存中…");
  const res=await post({action:"save",row:{工令單號:no,...collect(tr)}});
  if(!res){setStatus(td,"bad","⚠ 沒存成功");const b=document.createElement("button");b.className="btn btn-mini";b.textContent="重試";b.onclick=()=>schedule(tr);td.append(" ",b);return}
  applySaved(tr,res.row);
}
function applySaved(tr,row){
  const no=tr.dataset.no, td=statusCell(tr);
  saved.set(no,row); tr.classList.add("saved"); tr.classList.toggle("done",isDone(planOf.get(no),row));
  tr.querySelector("[data-people]").textContent=row["人數"]||"";
  for(const c of tr.querySelectorAll("td[data-sv]")) fillTimer(c,row);
  setStatus(td,"good","✓"); td.title="已存 "+row["更新時間"].slice(5,16);
  const b=document.createElement("button");b.className="btn btn-mini";b.textContent="清除";b.dataset.clear=no;td.append(" ",b);
  say(""); $("summary").textContent=$("summary").textContent.replace(/已填 \d+ 張/,"已填 "+saved.size+" 張");
}
$("rows").addEventListener("change",e=>{
  const tr=e.target.closest("tr"); if(!tr||!e.target.dataset.k) return;
  if(/^作業人員/.test(e.target.dataset.k)) updatePeople(tr);
  schedule(tr);
});
$("rows").addEventListener("click",async e=>{
  const no=e.target.dataset?.clear; if(!no) return;
  if(!confirm("清除 "+no+" 填過的資料（機台、人員、進度等）？\n訂單計畫單那邊不受影響，清除後無法復原。")) return;
  const res=await post({action:"remove",no}); if(!res) return;
  saved.delete(no); const tr=e.target.closest("tr"); const r=allRows().find(x=>x.no===no);
  if(r) tr.replaceWith(buildRow(r)); else tr.remove();
  refresh(); say("已清除 "+no,"ok");
});
// ---- sections: [section bar][rows ...] ----
const hdrAbove=tr=>{let h=tr.previousElementSibling;while(h&&h.dataset.no)h=h.previousElementSibling;return h};
const shown=t=>!t.hidden&&t.getClientRects().length>0;
const visPrev=tr=>{let p=tr.previousElementSibling;while(p&&!shown(p))p=p.previousElementSibling;return p};
const visNext=tr=>{let n=tr.nextElementSibling;while(n&&!shown(n))n=n.nextElementSibling;return n};
$("rows").addEventListener("click",e=>{                       // click a section bar to fold or unfold it
  const bar=e.target.closest("tr.sec"); if(!bar||bar.classList.contains("empty")) return;
  const id=bar.dataset.sec; collapsed.has(id)?collapsed.delete(id):collapsed.add(id);
  store.set("collapsed",[...collapsed]); applyCollapsed();
});
// After a row was dropped (or moved with an arrow): work out its block, give it a number between its neighbours,
// and save the new section together with the new position.
function placeRow(tr){
  let h=hdrAbove(tr); if(!h) return;
  const no=tr.dataset.no, sec=h.dataset.sec, oldSec=tr.dataset.sec;
  if(collapsed.has(sec)){collapsed.delete(sec);store.set("collapsed",[...collapsed]);applyCollapsed()}
  tr.dataset.sec=sec;
  const prev=tr.previousElementSibling&&tr.previousElementSibling.dataset.no?tr.previousElementSibling:null;
  const next=tr.nextElementSibling&&tr.nextElementSibling.dataset.no?tr.nextElementSibling:null;
  const kp=prev?keyOf.get(prev.dataset.no):null, kn=next?keyOf.get(next.dataset.no):null;
  const extra=sec!==oldSec?{分區:sec}:{};
  let k=keyOf.get(no);
  if(kp!=null&&kn!=null) k=(kp+kn)/2; else if(kp!=null) k=kp+1000; else if(kn!=null) k=kn-1000;
  k=Math.round(k*1e6)/1e6;
  if((kp!=null&&k<=kp)||(kn!=null&&k>=kn)) return renumber(tr);   // no room left between the neighbours
  keyOf.set(no,k); queueOrder(tr,k,extra); refreshCounts();
}
function queueOrder(tr,k,extra={}){
  const no=tr.dataset.no; setStatus(statusCell(tr),"","儲存順序…"); pending.add(no);
  queue=queue.then(async()=>{
    const res=await post({action:"save",row:{工令單號:no,排序:String(k),...extra}});
    if(res) applySaved(tr,res.row);
    else setStatus(statusCell(tr),"bad","⚠ 順序沒存成功");
  }).finally(()=>pending.delete(no));
}
function renumber(tr){                                          // give the whole section fresh, evenly spaced numbers
  const run=[]; for(let r=hdrAbove(tr).nextElementSibling; r&&r.dataset.no; r=r.nextElementSibling) run.push(r);
  run.forEach((r,i)=>{const k=(i+1)*1000; keyOf.set(r.dataset.no,k); queueOrder(r,k,r===tr?{分區:tr.dataset.sec}:{})});
}
// Real drag: the row lifts and follows the pointer while the other rows move out of its way; letting go drops it there.
let drag=null;
$("rows").addEventListener("pointerdown",e=>{
  const grip=e.target.closest?.("[data-grip]"); if(!grip||e.button>0) return;
  e.preventDefault();
  const tr=grip.closest("tr"), box=tr.getBoundingClientRect();
  drag={tr,grab:e.clientY-box.top,y:e.clientY,from:tr.nextElementSibling,scroller:tr.closest(".tablewrap"),raf:0};
  tr.style.transition="none"; tr.classList.add("lifted"); document.body.classList.add("dragging-rows");
  window.addEventListener("pointermove",onDragMove); window.addEventListener("pointerup",onDragEnd); window.addEventListener("pointercancel",onDragEnd);
  followRow(); loopScroll();
});
function onDragMove(e){ if(drag){drag.y=e.clientY;followRow()} }
// Where a row really sits, leaving out the slide it may be in the middle of.
function layoutBox(t){
  const r=t.getBoundingClientRect(), tf=getComputedStyle(t).transform;
  const dy=tf&&tf!=="none"?new DOMMatrixReadOnly(tf).m42:0; return {top:r.top-dy,height:r.height};
}
// A neighbour that changed places slides from where it was to its new place instead of jumping.
function slide(t,fromTop){
  t.style.transition="none"; t.style.transform="";
  const d=fromTop-t.getBoundingClientRect().top; if(!d) return;
  t.style.transform="translateY("+d+"px)"; t.getBoundingClientRect();
  t.style.transition="transform .16s ease-out"; t.style.transform="";
}
function followRow(){
  const tr=drag.tr, top=drag.y-drag.grab;
  tr.style.transform="";                                  // measure where the row sits in the table
  let rect=tr.getBoundingClientRect();
  for(;;){                                                // swap places while the row's centre has passed a neighbour's centre
    const mid=top+rect.height/2, prev=visPrev(tr), next=visNext(tr);
    const pb=prev&&layoutBox(prev), nb=next&&layoutBox(next);
    let sib=null;
    if(prev&&mid<pb.top+pb.height/2){sib=prev; const was=prev.getBoundingClientRect().top; tr.parentNode.insertBefore(tr,prev); slide(prev,was)}
    else if(next&&mid>nb.top+nb.height/2){sib=next; const was=next.getBoundingClientRect().top; tr.parentNode.insertBefore(next,tr); slide(next,was)}
    if(!sib) break;
    rect=tr.getBoundingClientRect();
  }
  tr.style.transform="translateY("+(top-rect.top)+"px)";
}
function loopScroll(){                                    // keep scrolling while the pointer is near the top or bottom edge
  if(!drag) return;
  const r=drag.scroller.getBoundingClientRect(), up=r.top+80, down=r.bottom-48; let dy=0;
  if(drag.y<up) dy=-Math.ceil((up-drag.y)/6); else if(drag.y>down) dy=Math.ceil((drag.y-down)/6);
  if(dy){drag.scroller.scrollTop+=dy;followRow()}
  drag.raf=requestAnimationFrame(loopScroll);
}
function onDragEnd(){
  if(!drag) return;
  const {tr,from}=drag; cancelAnimationFrame(drag.raf); drag=null;
  window.removeEventListener("pointermove",onDragMove); window.removeEventListener("pointerup",onDragEnd); window.removeEventListener("pointercancel",onDragEnd);
  document.body.classList.remove("dragging-rows");
  tr.style.transition="transform .14s ease-out"; tr.style.transform="";   // glide into its slot, then put it down
  setTimeout(()=>{tr.classList.remove("lifted"); tr.style.transition=""},150);
  if(tr.nextElementSibling!==from) placeRow(tr);
}
$("rows").addEventListener("click",e=>{                      // arrows move a row one place inside its block
  const d=Number(e.target.dataset?.move); if(!d) return;
  const tr=e.target.closest("tr"), sib=d<0?tr.previousElementSibling:tr.nextElementSibling;
  if(!sib||!sib.dataset.no||sib.hidden) return;
  tr.parentNode.insertBefore(tr,d<0?sib:sib.nextSibling); placeRow(tr);
  tr.querySelector(`[data-move="${d}"]`)?.focus();
});
function refresh(){render()}
window.addEventListener("beforeunload",e=>{if(pending.size) e.preventDefault()});   // do not lose edits that are still waiting to be saved

async function start(fresh){
  if(!API){say("還沒設定後端網址（config.js 的 sheetApi）。");return}
  if(!pin){showPin();return}
  say(fresh?"重新讀取計畫單平台中…（要等十幾秒）":"讀取計畫單平台中…（第一次可能要幾秒）","ok");
  const [o,b]=await Promise.all([get({action:"options"}),get({action:"board",...(fresh?{fresh:"1"}:{})})]);
  if(!o||!b) return;
  say(""); options=o.options||{}; if(options["機台"]) options["機台"]=options["機台"].filter(m=>!CAPSULE.test(m)); orders=b.orders||[]; planOf=new Map(orders.map(o=>[o.no,o])); saved=new Map((b.rows||[]).map(r=>[r["工令單號"],r]));
  if(!Object.keys(options).length) say("下拉選項讀不到：請在 Apps Script 指令碼屬性加上 BKE_SHEET_ID。目前下拉欄位先用手打。");
  buildHead(); buildFilters(); $("listPanel").hidden=false; refresh();
}
start();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工令單掃描</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15202b">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: one narrow column, phone-first; two tabs (scan / test work orders). Big tap targets for factory floor use. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d5dce3;
  --accent:#f2c200; --accent-ink:#1b1600; --go:#1d8a4c; --stop:#c43a2f; --warn-bg:#fff4cc; --warn-ink:#6b5200;
  --rework:#b54708; --rework-bg:#fdead7; --go-bg:#e2f3e9;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e6ebf0; --muted:#97a4b2; --line:#2c3843;
  --accent:#f2c200; --accent-ink:#1b1600; --go:#2fa866; --stop:#e05547; --warn-bg:#3a3110; --warn-ink:#f3dc8a;
  --rework:#f79a4f; --rework-bg:#3b2414; --go-bg:#13301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e6ebf0; --muted:#97a4b2; --line:#2c3843;
  --accent:#f2c200; --accent-ink:#1b1600; --go:#2fa866; --stop:#e05547; --warn-bg:#3a3110; --warn-ink:#f3dc8a;
  --rework:#f79a4f; --rework-bg:#3b2414; --go-bg:#13301f; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
header{display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0;text-wrap:balance}
.badge{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--warn-bg);color:var(--warn-ink);font-weight:600;letter-spacing:.04em}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button:focus-visible,.btn:focus-visible,.lang button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lang{display:flex;gap:6px;flex-wrap:wrap}
.lang button{all:unset;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.lang button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:12px;font-size:20px;font-weight:700;text-align:center;padding:8px 16px;width:100%}
.btn-scan{background:var(--accent);color:var(--accent-ink);min-height:96px;font-size:24px}
.btn-go{background:var(--go);color:#fff}
.btn-stop{background:var(--stop);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);min-height:48px;font-size:16px;font-weight:600}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.viewer{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.viewer video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.guide span{width:86%;height:34%;border:3px solid var(--accent);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.viewer.hit .guide span{border-color:var(--go)}
.hint{position:absolute;left:0;right:0;bottom:8px;margin:0;text-align:center;color:#fff;font-weight:600;font-size:15px;text-shadow:0 1px 3px #000}
.camctl{display:flex;gap:8px}
.camctl .btn{min-height:48px}
.photo-link{align-self:center;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px;padding:4px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;font:inherit;font-family:var(--font-mono);font-size:20px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-transform:uppercase}
.manual .btn{width:auto;min-height:52px;font-size:16px}
.msg{padding:12px 14px;border-radius:10px;font-weight:600}
.msg.err{background:var(--warn-bg);color:var(--warn-ink)}
.msg.busy{background:var(--bg);color:var(--muted)}
.order dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.order dt{color:var(--muted);font-size:14px;padding-top:3px}
.order dd{margin:0;font-size:18px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.order .no{font-size:26px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:4px;background:var(--rework-bg);color:var(--rework);margin-left:6px;vertical-align:middle}
.phase{text-align:center;border-radius:12px;padding:12px;background:var(--warn-bg);color:var(--warn-ink)}
.phase[data-phase="run"]{background:var(--go-bg);color:var(--go)}
.phase-name{font-size:20px;font-weight:700}
.clock{font-size:44px;font-weight:600;color:var(--ink)}
.done{display:flex;flex-direction:column;gap:10px}
.done label{font-size:18px;font-weight:700}
.done input{font:inherit;font-family:var(--font-mono);font-size:32px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.msg.ok{background:var(--go-bg);color:var(--go)}
.log{display:flex;flex-direction:column}
.group{padding:10px 0;border-top:2px solid var(--line)}
.group .head{font-weight:700}
.group .sum{font-size:14px;font-weight:600;margin-top:2px}
.group .row{padding:6px 0 6px 12px;border-top:1px dashed var(--line);font-size:14px}
.log h2,.sheet h2{font-size:15px;margin:0 0 6px;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.row .r{text-align:right}
.row .sub{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);margin:0}
/* test work orders */
.sheet{display:flex;flex-direction:column;gap:14px}
.slip{background:#fff;color:#111;border:1px solid #cfd6dd;border-radius:6px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.slip .h{display:flex;justify-content:space-between;font-size:12px;color:#555;gap:8px;flex-wrap:wrap}
.slip .lbl{font-size:13px;font-weight:600}
.slip svg{width:100%;height:auto;max-width:100%;display:block}
.slip .meta{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.slip .h-code{opacity:.9}
/* Android app: the native camera is drawn behind the page, so hide the page and keep only the scan overlay */
html.native-scanning,html.native-scanning body{background:transparent}
html.native-scanning body{visibility:hidden}
.native-scan{position:fixed;inset:0;z-index:10;visibility:visible}
.native-scan.hit .guide span{border-color:var(--go)}
.native-scan .hint{bottom:110px;padding:0 16px}
.native-scan .ctl{position:absolute;left:16px;right:16px;bottom:24px;display:flex;gap:8px}
.native-scan .btn{background:rgba(0,0,0,.6);color:#fff;border-color:rgba(255,255,255,.5)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top"><h1 id="t-title">工令單掃描</h1><span class="badge" id="t-demo">測試版・假資料</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="zh">中文</button><button data-lang="vi">Tiếng Việt</button><button data-lang="id">Bahasa Indonesia</button><button data-lang="th">ไทย</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-scan" aria-selected="true" data-t="tabScan">掃描</button>
      <button role="tab" id="tab-sheet" aria-selected="false" data-t="tabSheet">測試工令單</button>
    </div>
  </header>

  <main id="view-scan" class="wrap" style="gap:16px">
    <section class="panel" id="pinPanel" hidden>
      <label for="pinInput" data-t="pinAsk">請輸入工廠密碼（只需輸入一次）</label>
      <div class="manual">
        <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">
        <button class="btn btn-ghost" id="pinGo" data-t="ok">確定</button>
      </div>
    </section>
    <section class="panel" id="scanPanel">
      <button class="btn btn-scan" id="liveBtn"><span aria-hidden="true">▮▯▮▮▯▮</span><span data-t="live">掃描工令單</span></button>
      <div class="viewer" id="viewer" hidden>
        <video id="video" playsinline muted></video>
        <div class="guide" aria-hidden="true"><span></span></div>
        <p class="hint" id="hint" data-t="aim">把「工令單號」條碼放進框內</p>
      </div>
      <div class="camctl" id="camctl" hidden>
        <button class="btn btn-ghost" id="torchBtn" data-t="torch" hidden>手電筒</button>
        <button class="btn btn-ghost" id="closeCam" data-t="closeCam">關閉鏡頭</button>
      </div>
      <label class="photo-link" for="cam" id="scanBtn" data-t="scan">改用拍照</label>
      <input id="cam" type="file" accept="image/*" capture="environment" hidden>
      <div class="manual">
        <input id="manualNo" inputmode="text" autocomplete="off" maxlength="11" placeholder="V1150101001" aria-label="工令單號">
        <button class="btn btn-ghost" id="manualGo" data-t="find">查詢</button>
      </div>
      <div id="msg" class="msg" hidden></div>
    </section>

    <section class="panel order" id="order" hidden>
      <dl>
        <dt data-t="fNo">工令單號</dt><dd class="mono no" id="oNo"></dd>
        <dt data-t="fName">產品名稱</dt><dd id="oName"></dd>
        <dt data-t="fCode">產品編號</dt><dd class="mono" id="oCode"></dd>
        <dt data-t="fQty">數量</dt><dd id="oQty"></dd>
      </dl>
      <div class="phase" id="phase" hidden>
        <div class="phase-name" id="phaseName"></div>
        <div class="clock mono" id="clock">00:00:00</div>
      </div>
      <button class="btn btn-go" id="endPrepBtn" data-t="endPrep" hidden>前置結束，開始上機</button>
      <button class="btn btn-stop" id="endRunBtn" data-t="endRun" hidden>上機結束</button>
      <div class="done" id="donePanel" hidden>
        <label for="doneInput" data-t="doneAsk">完成顆數</label>
        <input id="doneInput" class="mono" type="number" inputmode="numeric" min="0" step="1" autocomplete="off">
        <div id="doneErr" class="msg err" data-t="needQty" hidden></div>
        <button class="btn btn-stop" id="saveBtn" data-t="saveEnd">確認，結束計時</button>
        <button class="btn btn-ghost" id="backBtn" data-t="back">返回</button>
      </div>
      <button class="btn btn-ghost" id="cancelBtn" data-t="cancelPrep" hidden>掃錯單，取消</button>
    </section>

    <section class="panel log">
      <h2 data-t="records">工時紀錄</h2>
      <div id="log"></div>
      <p class="note" data-t="logNote">測試版：紀錄只存在這支手機，不會上傳。</p>
    </section>
  </main>

  <p class="note" style="text-align:center"><a href="form.html">在途工單表單（電腦版）</a></p>

  <main id="view-sheet" class="sheet" hidden>
    <p class="note" data-t="sheetNote">用電腦開這一頁，再用手機的「掃描」頁對著螢幕拍照。全部是編造的測試資料。</p>
    <div id="slips" class="sheet"></div>
  </main>
</div>

<div class="native-scan" id="nativeScan" hidden>
  <div class="guide" aria-hidden="true"><span></span></div>
  <p class="hint" id="nativeHint" data-t="aim">把「工令單號」條碼放進框內</p>
  <div class="ctl">
    <button class="btn btn-ghost" id="nativeTorch" data-t="torch">手電筒</button>
    <button class="btn btn-ghost" id="nativeClose" data-t="closeCam">關閉鏡頭</button>
  </div>
</div>

<script src="config.js"></script>
<script src="vendor/JsBarcode.all.min.js"></script>
<script src="vendor/zxing-library.min.js"></script>
<script>
// ---- Fake work orders (made-up test data, not real) ----
const ORDERS = [
  {no:"V1150101001", code:"4100000000011", name:"測試品_維生素C 膠囊 盒裝(每盒30顆)", qty:1200, unit:"盒"},
  {no:"V1150101002", code:"4100000000028", name:"測試品_葉黃素 軟膠囊 袋裝(每袋10排)", qty:800, unit:"袋"},
  {no:"V1150102003", code:"4100000000035", name:"測試品_益生菌 粉包 盒裝(每盒20包)", qty:5000, unit:"包"},
  {no:"X1150102004", code:"4100000000042", name:"測試品_魚油 軟膠囊 瓶裝(每瓶60顆)", qty:300, unit:"瓶", rework:true},
  {no:"V1150103005", code:"4100000000059", name:"測試品_鈣片 錠劑 排裝(每排10錠)", qty:3000, unit:"排"},
  {no:"X1150103006", code:"4100000000066", name:"測試品_膠原蛋白 粉包 盒裝(每盒15包)", qty:450, unit:"盒", rework:true},
];
const FORMAT = /^[A-Z]\d{10}$/;          // 1 letter + 10 digits
const API = location.hash==="#demo" ? "" : (window.APP_CONFIG?.sheetApi||"");
const DEMO = !API;                        // no sheet configured: use the fake orders above
const orders = new Map(DEMO ? ORDERS.map(o=>[o.no,o]) : []);
const missing = new Set();
// Customer order barcodes (H...) sit on the same slip; they are never looked up.
const isCandidate = v=>FORMAT.test(v)&&!v.startsWith("H");
class LookupError extends Error{}
async function lookup(no){
  if(orders.has(no)) return orders.get(no);
  if(DEMO||missing.has(no)) return null;
  const pin=store.get("pin","");
  if(!pin){showPin();throw new LookupError("pin")}
  let res;
  try{res=await (await fetch(API+"?no="+encodeURIComponent(no)+"&pin="+encodeURIComponent(pin))).json()}
  catch(e){throw new LookupError("net")}
  if(res.ok){const o={...res.order};o.qty=Number(String(o.qty).replace(/,/g,""))||o.qty;orders.set(no,o);return o}
  if(res.error==="bad_pin"){store.set("pin","");showPin();throw new LookupError("pin")}
  if(res.error==="not_found"){missing.add(no);return null}
  throw new LookupError("net");
}
function lookupFailed(e){say(e instanceof LookupError&&e.message==="pin"?"badPin":"netErr")}

// ---- Languages ----
const T = {

      fNo:"工令單號",fName:"產品名稱",fCode:"產品編號",fQty:"數量",

      slipNo:"工令單號",slipQty:"數量"},
  vi:{title:"Quét lệnh sản xuất",demo:"Bản thử・Dữ liệu giả",tabScan:"Quét",tabSheet:"Phiếu thử",scan:"Chụp ảnh thay thế",live:"Quét phiếu",aim:"Đưa mã vạch “工令單號” vào khung",checking:"Đã đọc, đang tìm… ",torch:"Đèn pin",closeCam:"Tắt camera",camErr:"Không mở được camera. Hãy cho phép dùng camera, hoặc chụp ảnh.",tryPhoto:"Không quét được? Hãy bấm “Chụp ảnh thay thế” bên dưới.",find:"Tìm",pinAsk:"Nhập mật khẩu nhà máy (chỉ một lần)",ok:"OK",badPin:"Mật khẩu nhà máy không đúng, hãy nhập lại.",netErr:"Không kết nối được dữ liệu. Kiểm tra mạng rồi thử lại.",live1:"Bản thử",
      fNo:"Số lệnh SX",fName:"Tên sản phẩm",fCode:"Mã sản phẩm",fQty:"Số lượng",
      logNote:"Bản thử: dữ liệu chỉ lưu trên điện thoại này.",rework:"Làm lại",

      fNo:"No. perintah kerja",fName:"Nama produk",fCode:"Kode produk",fQty:"Jumlah",

// ---- Decode barcodes from a photo ----
// Real slips are not all Code 128 (test slips are), so every reader accepts the common linear formats.
const WEB_FORMATS=["code_128","code_39","code_93","codabar","itf","ean_13","ean_8","upc_a","upc_e"];
const NATIVE_FORMATS=["CODE_128","CODE_39","CODE_93","CODABAR","ITF","EAN_13","EAN_8","UPC_A","UPC_E"];
const fmtList=["CODE_128","CODE_39","CODE_93","CODABAR","ITF","EAN_13","EAN_8","UPC_A","UPC_E"].map(f=>ZXing.BarcodeFormat[f]);
const reader=new ZXing.MultiFormatReader();
{const h=new Map();h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,fmtList);h.set(ZXing.DecodeHintType.TRY_HARDER,true);reader.setHints(h)}

function zxingOnce(ctx,x,y,w,h){
  const d=ctx.getImageData(x,y,w,h).data,lum=new Uint8ClampedArray(w*h);
  for(let i=0,j=0;j<lum.length;i+=4,j++) lum[j]=(d[i]*306+d[i+1]*601+d[i+2]*117)>>10;
  const src=new ZXing.RGBLuminanceSource(lum,w,h);
  for(const bin of [b=>new ZXing.HybridBinarizer(b),b=>new ZXing.GlobalHistogramBinarizer(b)]){
    try{return reader.decode(new ZXing.BinaryBitmap(bin(src))).getText()}catch(e){}
  }
  return null;
}
function canvasFrom(img,maxW,rotate){
  const s=Math.min(1,maxW/Math.max(img.width,img.height));
  let w=Math.round(img.width*s),h=Math.round(img.height*s);
  const c=document.createElement("canvas");
  if(rotate){c.width=h;c.height=w}else{c.width=w;c.height=h}
  const ctx=c.getContext("2d",{willReadFrequently:true});
  if(rotate){ctx.translate(h,0);ctx.rotate(Math.PI/2)}
  ctx.drawImage(img,0,0,w,h);
  return {c,ctx};
}
async function readCodes(img){
  const found=new Set();
  if("BarcodeDetector" in window){
    try{const det=new BarcodeDetector({formats:WEB_FORMATS});
      for(const r of await det.detect(img)) found.add(r.rawValue)}catch(e){}
    if([...found].some(v=>isCandidate(clean(v)))) return [...found];
  }
  for(const rotate of [false,true]){
    for(const maxW of [1600,1000,2400]){
      const {c,ctx}=canvasFrom(img,maxW,rotate);
      const full=zxingOnce(ctx,0,0,c.width,c.height); if(full) found.add(full);
      // A slip carries two barcodes; scan horizontal strips so each one gets its own pass.
      for(const n of [6,4,10]){
        const sh=Math.round(c.height/n);
        for(let y=0;y+sh<=c.height+1;y+=Math.round(sh/2)){
          const r=zxingOnce(ctx,0,y,c.width,Math.min(sh,c.height-y)); if(r) found.add(r);
        }
        if([...found].some(v=>isCandidate(clean(v)))) return [...found];
      }
      await new Promise(r=>setTimeout(r));
    }
    if([...found].some(v=>isCandidate(clean(v)))) return [...found];
  }
  return [...found];
}
// Keep just the work-order number when a barcode carries extra characters around it (start/stop or check characters, spaces).
const clean=v=>{const u=String(v).trim().toUpperCase();return (u.match(/[A-Z]\d{10}/)||[u])[0]};

function loadImage(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{ok(im)};im.onerror=no;im.src=u})}

$("cam").addEventListener("change",async e=>{

// Customer order barcodes (H...) share the slip; anything not in the work-order list is ignored silently.
async function pick(codes){
  const cands=[...new Set(codes.map(clean))].filter(isCandidate);
  if(!cands.length) return say("noCode");
  try{
    for(const v of cands){ if(await lookup(v)) return open(v) }
  }catch(e){return lookupFailed(e)}
  say("notFound",cands[0]);
}

// ---- Live camera: read continuously, accept only codes that exist as work orders ----
let stream=null,loop=null,detector=null,audio=null,lastMiss="",slowHint=null;
const VIDEO={width:{ideal:1920},height:{ideal:1080}};
const canAutofocus=s=>!!s.getVideoTracks()[0].getCapabilities?.().focusMode?.includes("continuous");
const camById=id=>navigator.mediaDevices.getUserMedia({audio:false,video:{...VIDEO,deviceId:{exact:id}}}).catch(()=>null);
// Multi-camera Android phones may hand the page a fixed-focus lens (e.g. ultra-wide) that cannot read a slip up close.
// Look for a back camera that can autofocus, and remember it for next time.
async function openCamera(){
  const saved=store.get("camId","");
  const got=saved&&await camById(saved);
  if(got) return got;
  const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{...VIDEO,facingMode:{ideal:"environment"}}});
  if(canAutofocus(s)||!/Android/i.test(navigator.userAgent)) return s;
  const using=s.getVideoTracks()[0].getSettings().deviceId;
  const backs=(await navigator.mediaDevices.enumerateDevices())
    .filter(d=>d.kind==="videoinput"&&d.deviceId!==using&&/back|rear|environment|後/i.test(d.label))
    .sort((a,b)=>/\b0\b/.test(b.label)-/\b0\b/.test(a.label));   // "camera2 0" is usually the main lens
  s.getTracks().forEach(t=>t.stop());
  for(const d of backs){
    const c=await camById(d.deviceId);
    if(c&&canAutofocus(c)){store.set("camId",d.deviceId);return c}
    c?.getTracks().forEach(t=>t.stop());
  }
  return navigator.mediaDevices.getUserMedia({audio:false,video:{...VIDEO,facingMode:{ideal:"environment"}}});
}
const frame=document.createElement("canvas"),fctx=frame.getContext("2d",{willReadFrequently:true});
async function startCam(){
  hush();
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{
    stream=await openCamera();
  }catch(e){stream=null;return say("camErr")}
  const v=$("video"); v.srcObject=stream; await v.play().catch(()=>{});
  const track=stream.getVideoTracks()[0], caps=track.getCapabilities?.()||{};
  if(caps.focusMode?.includes("continuous")) track.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{});
  // A little zoom lets the phone stay far enough from the paper slip to focus.
  if(caps.zoom?.max>=1.5) track.applyConstraints({advanced:[{zoom:Math.max(caps.zoom.min||1,1.5)}]}).catch(()=>{});
  $("torchBtn").hidden=!caps.torch;
  $("viewer").hidden=false; $("camctl").hidden=false; $("liveBtn").hidden=true; $("viewer").classList.remove("hit"); $("hint").textContent=t("aim");
  if(!detector&&"BarcodeDetector" in window){
    try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes("code_128"))detector=new BarcodeDetector({formats:WEB_FORMATS.filter(x=>f.includes(x))})}catch(e){}
  }
  lastMiss=""; scanFrame();
  clearTimeout(slowHint); slowHint=setTimeout(()=>{if(stream)say("tryPhoto","","busy")},8000);
}
function stopCam(){
  clearTimeout(loop); loop=null; clearTimeout(slowHint);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $("viewer").hidden=true; $("camctl").hidden=true; $("liveBtn").hidden=false;
}
async function scanFrame(){
  if(!stream) return;
  const v=$("video"); let vals=[];
  if(v.readyState>=2&&v.videoWidth){
    if(detector){
      try{vals=(await detector.detect(v)).map(r=>clean(r.rawValue))}catch(e){}
    }
    // Real slips carry a very flat, long barcode that native detectors often miss; ZXing reads it row by row.
    if(!vals.some(isCandidate)){
      // Decode the band inside the guide frame, split in strips so the H barcode below cannot hide the work order one.
      const s=Math.min(1,1920/v.videoWidth),w=Math.round(v.videoWidth*s),h=Math.round(v.videoHeight*s);
      frame.width=w;frame.height=h;fctx.drawImage(v,0,0,w,h);
      const top=Math.round(h*.25),band=Math.round(h*.5),n=3,sh=Math.round(band/n);
      const full=zxingOnce(fctx,0,top,w,band); if(full) vals.push(clean(full));
      for(let i=0;i<n*2-1&&!vals.some(isCandidate);i++){const r=zxingOnce(fctx,0,top+Math.round(i*sh/2),w,sh);if(r)vals.push(clean(r))}
    }
  }
  if(!stream) return;
  for(const x of vals.filter(isCandidate)){
    if(x===lastMiss) continue;
    // Signal the read right away: the sheet lookup can take a few seconds.
    clearTimeout(slowHint); $("viewer").classList.add("hit"); beep(); navigator.vibrate?.(120); $("hint").textContent=t("checking")+x;
    let o;
    try{o=await lookup(x)}catch(e){stopCam();return lookupFailed(e)}
    if(!stream) return;
    if(o){setTimeout(()=>{stopCam();open(x)},150);return}
    $("viewer").classList.remove("hit"); $("hint").textContent=t("aim");
    lastMiss=x; say("notFound",x);
  }
  loop=setTimeout(scanFrame,60);
}
function beep(){
  try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=1500;g.gain.value=.15;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch(e){}
}
$("liveBtn").onclick=startCam;
$("closeCam").onclick=stopCam;
let torch=false;
$("torchBtn").onclick=()=>{const tr=stream?.getVideoTracks()[0];if(!tr)return;torch=!torch;tr.applyConstraints({advanced:[{torch}]}).catch(()=>{})};

// ---- Android app (Capacitor shell): scan with the phone's own ML Kit scanner instead of the web camera ----
const NativeScanner=window.Capacitor?.isNativePlatform?.()?(window.Capacitor.Plugins?.BarcodeScanner||window.Capacitor.registerPlugin?.("BarcodeScanner")):null;
let nativeOn=false,nativeBusy=false;
async function startNative(){
  hush();
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{
    const {camera}=await NativeScanner.requestPermissions();
    if(camera!=="granted"&&camera!=="limited") return say("camErr");
    lastMiss=""; nativeBusy=false;
    await NativeScanner.addListener("barcodesScanned",e=>onNativeCodes((e.barcodes||[]).map(b=>clean(b.rawValue||b.displayValue||""))));
    // The default 640x480 analysis is too coarse for the flat barcode on real slips.
    await NativeScanner.startScan({formats:NATIVE_FORMATS,resolution:2});   // 2 = 1920x1080
    NativeScanner.getMaxZoomRatio().then(({zoomRatio})=>NativeScanner.setZoomRatio({zoomRatio:Math.min(1.5,zoomRatio)})).catch(()=>{});
  }catch(e){await stopNative();return say("camErr")}
  nativeOn=true; document.documentElement.classList.add("native-scanning");
  $("nativeScan").hidden=false; $("nativeScan").classList.remove("hit"); $("nativeHint").textContent=t("aim");
  $("nativeTorch").hidden=!(await NativeScanner.isTorchAvailable().catch(()=>({available:false}))).available;
}
async function stopNative(){
  nativeOn=false; document.documentElement.classList.remove("native-scanning"); $("nativeScan").hidden=true;
  try{await NativeScanner.removeAllListeners()}catch(e){}
  try{await NativeScanner.stopScan()}catch(e){}
}
async function onNativeCodes(vals){
  if(!nativeOn||nativeBusy) return;
  for(const x of vals.filter(isCandidate)){
    if(x===lastMiss) continue;
    nativeBusy=true;
    $("nativeScan").classList.add("hit"); beep(); navigator.vibrate?.(120); $("nativeHint").textContent=t("checking")+x;
    let o;
    try{o=await lookup(x)}catch(e){await stopNative();return lookupFailed(e)}
    if(!nativeOn) return;
    if(o){await stopNative();return open(x)}
    $("nativeScan").classList.remove("hit"); $("nativeHint").textContent=t("notFound")+x;
    lastMiss=x; nativeBusy=false; return;
  }
}
// ML Kit misses the flat barcode on real slips (tested 2026-10-13) while ZXing on the web camera reads it,
// so the app keeps the web scanner and only falls back to ML Kit when the WebView has no camera access.
if(NativeScanner&&!navigator.mediaDevices?.getUserMedia){
  $("liveBtn").hidden=false; $("liveBtn").onclick=startNative;
  $("nativeClose").onclick=stopNative;
  $("nativeTorch").onclick=()=>NativeScanner.toggleTorch().catch(()=>{});
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&nativeOn)stopNative()});
}

// ---- Order + phase timer ----
// One job at a time. Scanning starts 前置 (prep), or 上機 (run) directly for an order already worked on;
// ending prep starts run right away; ending run asks for the finished count.
// Every finished phase is its own log entry so prep and run time stay separate for wage calculation later.
let current=null,timer=null;
let running=store.get("running",null);   // {no,phase:"prep"|"run",start,o,scanned}  scanned: started by a scan, may be cancelled
let log=store.get("log",[]).map(r=>({phase:"run",...r}));   // newest first: [{no,name,phase,start,end,done?}]
if(running){running.phase??="prep"; if(running.o) orders.set(running.no,running.o); current=running.no}
function save(){store.set("running",running);store.set("log",log);renderLog()}
function open(no){
  hush(); $("manualNo").value="";
  if(running&&running.no!==no){no=running.no;say("finishFirst")}
  else if(!running){running={no,phase:log.some(r=>r.no===no)?"run":"prep",start:Date.now(),o:orders.get(no),scanned:true};save()}
  current=no; showOrder(no); $("order").scrollIntoView({behavior:"smooth",block:"start"});
}
function showOrder(no){
  const o=orders.get(no)||{no,name:running?.name||"",code:"",qty:"",unit:""}; $("order").hidden=false;
  $("oNo").textContent=o.no; $("oName").textContent=o.name; $("oCode").textContent=o.code;
  $("oQty").textContent=o.qty.toLocaleString()+" "+o.unit;
  if(o.rework){const s=document.createElement("span");s.className="tag";s.textContent=t("rework");$("oNo").append(s)}
  syncTimer();
}
function closeOrder(){current=null;$("order").hidden=true;$("donePanel").hidden=true;clearInterval(timer)}
function syncTimer(){
  const on=!!running&&running.no===current, prep=on&&running.phase==="prep", asking=!$("donePanel").hidden;
  $("phase").hidden=!on;
  if(on){$("phase").dataset.phase=running.phase;$("phaseName").textContent=t(prep?"phasePrep":"phaseRun")}
  $("endPrepBtn").hidden=!prep; $("cancelBtn").hidden=!on||!running.scanned||asking; $("endRunBtn").hidden=!on||prep||asking;
  clearInterval(timer); if(on){tick();timer=setInterval(tick,1000)}
}
function tick(){const s=Math.floor((Date.now()-running.start)/1000);$("clock").textContent=[s/3600,s%3600/60,s%60].map(n=>String(Math.floor(n)).padStart(2,"0")).join(":")}
const finish=(end,extra)=>({no:running.no,name:running.o?.name||running.name||"",phase:running.phase,start:running.start,end,...extra});
$("endPrepBtn").onclick=()=>{const now=Date.now();log.unshift(finish(now));running={...running,phase:"run",start:now,scanned:false};save();syncTimer()};
$("endRunBtn").onclick=()=>{$("donePanel").hidden=false;$("doneErr").hidden=true;$("doneInput").value="";syncTimer();$("doneInput").focus()};
$("backBtn").onclick=()=>{$("donePanel").hidden=true;syncTimer()};
$("saveBtn").onclick=()=>{
  const v=$("doneInput").value.trim(), n=Number(v);
  if(v===""||!Number.isInteger(n)||n<0){$("doneErr").hidden=false;return}
  log.unshift(finish(Date.now(),{done:n})); running=null; save(); closeOrder();
  say("saved","","ok"); window.scrollTo({top:0,behavior:"smooth"});
};

const hm=ms=>new Date(ms).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:false});
const md=ms=>{const d=new Date(ms);return (d.getMonth()+1)+"/"+d.getDate()};
const mins=ms=>Math.max(1,Math.round(ms/60000))+" "+t("min");
const div=(cls,text)=>{const d=document.createElement("div");d.className=cls;d.textContent=text;return d};
// Grouped by work order, most recently active first; each group totals prep time, run time and finished count.
function renderLog(){
  const el=$("log"); el.textContent="";
  const rows=[...(running?[{...running,name:running.o?.name||running.name||"",end:null}]:[]),...log];
  if(!rows.length){const p=document.createElement("p");p.className="empty";p.textContent=t("empty");el.append(p);return}
  const groups=new Map();
  for(const r of rows){if(!groups.has(r.no))groups.set(r.no,[]);groups.get(r.no).push(r)}
  for(const [no,rs] of groups){
    const sum={prep:0,run:0,done:0};
    for(const r of rs){if(r.end)sum[r.phase]+=r.end-r.start;sum.done+=r.done||0}
    const g=document.createElement("div");g.className="group";
    g.append(div("head mono",no),div("sub",rs.find(r=>r.name)?.name||""),
      div("sum",[t("phasePrep")+" "+(sum.prep?mins(sum.prep):"—"),t("phaseRun")+" "+(sum.run?mins(sum.run):"—"),t("done")+" "+sum.done.toLocaleString()+" "+t("pcs")].join("・")));
    for(const r of rs){
      const d=document.createElement("div");d.className="row";
      d.append(div("",t(r.phase==="prep"?"phasePrep":"phaseRun")),
        div("r mono",md(r.start)+" "+hm(r.start)+" – "+(r.end?hm(r.end):"…")),
        div("sub",r.done!=null?t("done")+" "+r.done.toLocaleString()+" "+t("pcs"):""),
        div("r sub",r.end?mins(r.end-r.start):t("inProgress")));
      g.append(d);
    }
    el.append(g);
  }
}

// ---- Test slips with real Code 128 barcodes ----
function renderSlips(){
  const box=$("slips"); box.textContent="";
  for(const o of ORDERS){
    const s=document.createElement("article");s.className="slip";
    s.innerHTML=`<div class="h"><span>BKE 測試列印</span><span class="mono"></span></div>
      <div class="lbl"></div><svg class="bc-no"></svg>
      <div class="meta"><span class="nm"></span><span class="q"></span></div>`;
    s.querySelector(".h .mono").textContent=o.code;
    s.querySelector(".lbl").textContent=t("slipNo");
    s.querySelector(".nm").textContent=o.name+(o.rework?"（"+t("rework")+"）":"");
    s.querySelector(".q").textContent=t("slipQty")+"："+o.qty.toLocaleString()+" "+o.unit;
    box.append(s);
    JsBarcode(s.querySelector(".bc-no"),o.no,{format:"CODE128",height:70,width:2,margin:12,displayValue:false,background:"#ffffff",lineColor:"#000000"});
  }
}

function showPin(){$("pinPanel").hidden=false;$("pinInput").focus()}
$("pinGo").onclick=()=>{const v=$("pinInput").value.trim();if(!v)return;store.set("pin",v);$("pinInput").value="";$("pinPanel").hidden=true;hush()};
$("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("pinGo").click()});
if(!DEMO){ $("tab-sheet").hidden=true; document.querySelector(".tabs").style.gridTemplateColumns="1fr"; if(!store.get("pin","")) showPin() }

applyLang();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

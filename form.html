<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工廠管理</title>
<link rel="icon" href="icons/icon-192.png">
<style>
/* Scheduling board for the 五股廠(生產組) sheet of BKE在途工單: a row per line, a lane per machine, a card per work order. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d5dce3; --soft:#eaf2fb;
  --accent:#f2c200; --go:#1d8a4c; --go-bg:#e2f3e9; --stop:#c43a2f; --stop-bg:#fbe9e7; --warn-bg:#fff4cc; --warn-ink:#6b5200;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e6ebf0; --muted:#97a4b2; --line:#2c3843; --soft:#1b2b3b;
  --go:#2fa866; --go-bg:#13301f; --stop:#e05547; --stop-bg:#3a1b18; --warn-bg:#3a3110; --warn-ink:#f3dc8a; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:14px;line-height:1.4;padding:12px}
.wrap{display:flex;flex-direction:column;gap:12px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
a{color:inherit}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:32px}
input:focus-visible,select:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.btn{cursor:pointer;font:inherit;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 14px;min-height:34px}
.btn-go{background:var(--go);border-color:var(--go);color:#fff}
.btn-stop{color:var(--stop);border-color:var(--stop)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:8px 12px;border-radius:8px;font-weight:600}
.msg.err{background:var(--warn-bg);color:var(--warn-ink)}
.msg.ok{background:var(--go-bg);color:var(--go)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{width:240px}
.note{font-size:13px;color:var(--muted);margin:0}

/* board */
#board{display:flex;flex-direction:column;gap:12px}
.bsec{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.bsec-h{all:unset;box-sizing:border-box;width:100%;background:#000;color:#fff;font-size:15px;font-weight:700;padding:7px 14px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.bsec-h:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.bsec-h .cnt{font-weight:400;opacity:.75;font-size:13px}
.bsec-h .hint{margin-left:auto;font-weight:400;font-size:12px;opacity:.7}
.bsec.empty .bsec-h{background:var(--bg);color:var(--muted);cursor:default}
.bsec.over .bsec-h{outline:3px solid var(--accent);outline-offset:-3px}
.lanes{display:flex;gap:10px;padding:10px 12px 12px;overflow-x:auto;align-items:flex-start}
.lane{flex:0 0 220px;background:var(--bg);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.lane.wait{background:var(--stop-bg)}
.lane.spare{display:none}
.bsec.show-spare .lane.spare,body.dragging .lane.spare{display:flex}
.lane-h{font-size:13px;font-weight:700;display:flex;justify-content:space-between;padding:2px 4px}
.lane.wait .lane-h{color:var(--stop)}
.lane-h .cnt{font-weight:400;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:6px;min-height:44px;border-radius:8px}
.cards .gap-hint{font-size:12px;color:var(--muted);text-align:center;padding:10px 6px;border:1px dashed var(--line);border-radius:8px}
.cards:has(.card) .gap-hint{display:none}
.spare-btn{all:unset;flex:0 0 auto;align-self:stretch;writing-mode:vertical-rl;cursor:pointer;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.spare-btn:hover{color:var(--ink);border-color:var(--muted)}
.spare-btn:focus-visible{outline:3px solid var(--accent)}
body.dragging .spare-btn{display:none}

/* cards: only what you need at a glance; the rest is one click away */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:grab;touch-action:none;user-select:none;display:flex;flex-direction:column;gap:2px}
.card:hover{border-color:var(--muted)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.card .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .no{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.card .nm{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.card .pp{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.card .pp span{background:var(--soft);color:var(--ink);border-radius:4px;padding:0 6px}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;background:var(--go-bg);color:var(--go);white-space:nowrap}
.tag.rw{background:#fdead7;color:#b54708}
.card.working{box-shadow:inset 3px 0 0 var(--go)}
.card.done{opacity:.5}
.card.ph{opacity:.3;border-style:dashed}
.card.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.28);transform:rotate(1.5deg);margin:0}
body.dragging{cursor:grabbing;user-select:none}
body.dragging *{cursor:grabbing!important}

/* editor */
.editor{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end}
.ed-box{width:min(560px,100%);height:100%;overflow:auto;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ed-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ed-head h2{margin:0;font-size:18px}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ed-grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.ed-grid label input,.ed-grid label select{color:var(--ink);font-size:14px;width:100%}
.ed-info{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px}
.ed-info div span{display:block;font-size:11px;color:var(--muted)}
.status{font-size:12px;color:var(--muted)}
.status.bad{color:var(--stop);font-weight:700}
.status.good{color:var(--go)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>工廠管理 <small class="note">五股廠(生產組)・粉包</small></h1>
    <a href="index.html">← 掃碼 App</a>
  </header>

  <section class="panel" id="pinPanel" hidden>
    <label for="pinInput">請輸入工廠密碼（和掃碼 App 同一組，只需輸入一次）</label>
    <div class="row-actions"><input id="pinInput" type="password" autocomplete="off" style="max-width:240px"><button class="btn btn-go" id="pinGo">確定</button></div>
  </section>

  <div id="msg" class="msg" hidden></div>

  <section class="panel" id="listPanel" hidden>
    <div class="tools">
      <input id="q" type="search" placeholder="搜尋工令單號、品名、人員">
      <select id="machineFilter" aria-label="機台"><option value="">全部機台</option></select>
      <select id="statusFilter" aria-label="狀態">
        <option value="open">未完工</option><option value="all">全部</option>
        <option value="unassigned">還沒排機台</option><option value="assigned">已排機台</option><option value="done">已完工</option>
      </select>
      <button class="btn" id="reloadBtn">重新讀取</button>
      <span class="note" id="summary"></span>
    </div>
    <p class="note">拖卡片到別的機台就換機台，拖回紅色「等待安排」就清掉機台，同一欄上下拖是排先後；拖到別的大分類標題就換分類。點卡片看完整資料、填其他欄位。</p>
    <div id="board"></div>
  </section>
</div>

<script src="config.js"></script>
<script>
const API = window.APP_CONFIG?.sheetApi || "";
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const $ = id => document.getElementById(id);
// Hand-filled fields, in the order of the 五股廠(生產組) sheet. Dropdown lists (opt) come from the backend because they hold staff names.
const FIELDS = [
  {k:"作業人員1", label:"作業人員 1", t:"select", opt:"作業人員"},
  {k:"作業人員2", label:"作業人員 2", t:"select", opt:"作業人員"},
  {k:"作業人員3", label:"作業人員 3", t:"select", opt:"作業人員"},
  {k:"作業人員4", label:"作業人員 4", t:"select", opt:"作業人員"},
  {k:"機台", t:"select", opt:"機台"},
  {k:"預計完工日", t:"select", opt:"預計完工日"},
  {k:"天/時", t:"select", opt:"天/時"},
  {k:"製造日期", t:"date"},
  {k:"生產進度", t:"number"},
  {k:"完工時間", t:"date"},
  {k:"實際用時(時)", t:"number"},
  {k:"實際用時(分)", t:"number"},
  {k:"進度說明", t:"select", opt:"進度說明"},
  {k:"出貨點", t:"text", list:["出貨客戶","五股包裝"]},
  {k:"答交", t:"text"},
  {k:"作業時間", t:"text"},
  {k:"備註", t:"text"},
  {k:"完工資訊", t:"text"},
];
let pin = store.get("pin",""), options = {}, orders = [], planOf = new Map(), saved = new Map(), queue = Promise.resolve();
const pending = new Set();
// 品項 that go into the 五股廠(生產組) sheet (checked 2026-10-14). Powder first; the capsule line is a separate project and stays hidden.
const TRANSIT_ITEMS = ["7混料","4三面封粉包","4粉包"];
const CAPSULE = /膠囊|打排/;

function say(text, cls="err"){const m=$("msg");m.className="msg "+cls;m.textContent=text;m.hidden=!text}
const ERR = {bad_pin:"工廠密碼不正確。", not_configured:"後端還沒設定密碼。", bad_format:"工令單號格式不對。", not_found:"訂單計畫單查不到這個工令單號。", row_missing:"這筆資料已經不存在，請重新整理。", bad_request:"送出的資料有問題。"};
async function request(fn){
  try{
    const res = await fn();
    if(res.ok) return res;
    if(res.error==="bad_pin"){store.set("pin","");pin="";showPin()}
    say(ERR[res.error]||"發生錯誤："+res.error); return null;
  }catch(e){say("連不上伺服器，請確認網路後再試。"); return null}
}
const get = params => request(async()=>(await fetch(API+"?"+new URLSearchParams({pin,...params}))).json());
// text/plain keeps this a "simple" request, so the browser needs no CORS preflight against Apps Script
const post = body => request(async()=>(await fetch(API,{method:"POST",body:JSON.stringify({pin,...body})})).json());
function showPin(){$("pinPanel").hidden=false;$("listPanel").hidden=true;$("pinInput").focus()}
$("pinGo").onclick=()=>{const v=$("pinInput").value.trim();if(!v)return;pin=v;store.set("pin",v);$("pinInput").value="";$("pinPanel").hidden=true;say("");start()};
$("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("pinGo").click()});

// ---- rows: every order of 計畫單平台 (五股廠) plus what was filled in here ----
const isDone = (plan,s) => !!(plan?.done || s?.["進度說明"]==="完工");   // 工令完工 ticked in 計畫單平台, or marked 完工 here
const keyOf = new Map();
function allRows(){
  const seen=new Set(), out=[];
  for(const o of orders){if(seen.has(o.no))continue;seen.add(o.no);out.push({no:o.no,plan:o,saved:saved.get(o.no)||null})}
  for(const [no,r] of saved) if(!seen.has(no)) out.push({no,plan:null,saved:r});   // filled in earlier, order has left the plan sheet
  // Cards that were dragged have a saved 排序 number; the others follow, newest order number first.
  const num=r=>parseFloat(r.saved?.["排序"]);
  const plain=out.filter(r=>!Number.isFinite(num(r))).sort((a,b)=>b.no.slice(1).localeCompare(a.no.slice(1))||a.no.localeCompare(b.no));
  keyOf.clear(); plain.forEach((r,i)=>keyOf.set(r.no,1e9+i));
  for(const r of out) if(Number.isFinite(num(r))) keyOf.set(r.no,num(r));
  return out.sort((a,b)=>keyOf.get(a.no)-keyOf.get(b.no));
}
const peopleOf = r => [1,2,3,4].map(i=>r?.["作業人員"+i]).filter(Boolean);

// Sections follow the black bars of the original sheet = the line an order runs on; a product's mixing order sits with its packing order.
// 加大型 starts empty: people drag cards into it.
const SECTIONS=[{id:"std",name:"標準型粉包機 5台"},{id:"big",name:"加大型粉包機 1台"},{id:"mix",name:"混料"}];
const WAIT="等待安排";
const MACHINES={std:/小粉包機|混料/,big:/大粉包機|混料/,mix:/混料/};   // the machines of each line (empty ones appear while dragging)
const POWDER=["4三面封粉包","4粉包"];
const collapsed=new Set(store.get("collapsed",[])), showSpare=new Set();
function defaultSection(r){
  const item=r.plan?.item||"";
  if(CAPSULE.test(item)) return "capsule";
  if(POWDER.includes(item)) return "std";
  if(item==="7混料"){                                       // follow the neighbouring work order (pack N, mix N+1) when there is one
    const n=Number(r.no.slice(1));
    for(const d of [-1,1]){const o=planOf.get(r.no[0]+String(n+d)); if(o){ if(POWDER.includes(o.item)) return "std"; if(CAPSULE.test(o.item)) return "capsule" }}
    return "mix";
  }
  return "std";
}
const sectionOf=r=>SECTIONS.some(x=>x.id===r.saved?.["分區"])?r.saved["分區"]:defaultSection(r);
function visibleRows(){
  const q=$("q").value.trim().toLowerCase(), mc=$("machineFilter").value, st=$("statusFilter").value;
  return allRows().filter(r=>{
    const s=r.saved;
    if(!s&&(defaultSection(r)==="capsule"||!TRANSIT_ITEMS.includes(r.plan?.item))) return false;   // filled-in cards always stay
    if(mc&&s?.["機台"]!==mc) return false;
    if(st==="open"&&isDone(r.plan,s)) return false;
    if(st==="done"&&!isDone(r.plan,s)) return false;
    if(st==="unassigned"&&s?.["機台"]) return false;
    if(st==="assigned"&&!s?.["機台"]) return false;
    if(!q) return true;
    return [r.no,r.plan?.name||s?.["產品名稱"],r.plan?.code,peopleOf(s).join(" ")].join(" ").toLowerCase().includes(q);
  });
}

// ---- board ----
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
function laneNames(secId,rs){
  const order=options["機台"]||[], rank=m=>{const i=order.indexOf(m);return i<0?1e6:i};
  const names=new Set(rs.map(r=>r.saved?.["機台"]).filter(Boolean)); for(const m of order) if(MACHINES[secId].test(m)) names.add(m);
  return [...names].sort((x,y)=>rank(x)-rank(y)||x.localeCompare(y));
}
function cardOf(r){
  const s=r.saved||{}, p=r.plan||{};
  const c=el("div","card"); c.dataset.no=r.no; c.tabIndex=0; c.setAttribute("role","button");
  if(isDone(r.plan,r.saved)) c.classList.add("done"); if(s["進度說明"]==="作業中") c.classList.add("working");
  const top=el("div","top"), tags=el("span");
  if(p.rework) tags.append(el("span","tag rw","重工")); if(s["進度說明"]) tags.append(" ",el("span","tag",s["進度說明"]));
  top.append(el("span","no",r.no),tags);
  const name=p.name||s["產品名稱"]||""; const nm=el("div","nm",name); nm.title=name;
  const foot=el("div","foot"), pp=el("span","pp");
  for(const n of peopleOf(r.saved)) pp.append(el("span",null,n));
  foot.append(el("span",null,((p.qty??s["數量"]??"")+" "+(p.unit??s["單位"]??"")).trim()),pp);
  c.append(top,nm,foot);
  return c;
}
function lane(secId,mach,rs,spare){
  const ln=el("div","lane"+(mach?"":" wait")+(spare?" spare":"")), lh=el("div","lane-h");
  lh.append(el("span",null,mach||WAIT),el("span","cnt",String(rs.length))); ln.append(lh);
  const list=el("div","cards"); list.dataset.sec=secId; list.dataset.mach=mach;
  list.append(el("div","gap-hint",mach?"放到這裡排給 "+mach:"還沒排機台的單"));
  for(const r of rs) list.append(cardOf(r));
  ln.append(list); return ln;
}
function renderBoard(){
  const rows=visibleRows(), board=$("board"); board.textContent="";
  const bySec=new Map(SECTIONS.map(x=>[x.id,[]]));
  for(const r of rows) (bySec.get(sectionOf(r))||bySec.get("mix")).push(r);
  for(const sec of SECTIONS){
    const rs=bySec.get(sec.id), open=rs.length&&!collapsed.has(sec.id);
    const box=el("section","bsec"+(rs.length?"":" empty")+(showSpare.has(sec.id)?" show-spare":"")); box.dataset.sec=sec.id;
    const h=el("button","bsec-h"); h.dataset.sec=sec.id; h.setAttribute("aria-expanded",open);
    h.append(el("span",null,rs.length?(open?"▾":"▸"):"・"),el("span",null,sec.name),el("span","cnt","（"+rs.length+"）"));
    if(!rs.length) h.append(el("span","hint","目前沒有單，把卡片拖到這條就會移進這一區"));
    box.append(h);
    if(open){
      const lanes=el("div","lanes");
      lanes.append(lane(sec.id,"",rs.filter(r=>!r.saved?.["機台"])));
      let spare=0;
      for(const m of laneNames(sec.id,rs)){ const mine=rs.filter(r=>r.saved?.["機台"]===m); if(!mine.length) spare++; lanes.append(lane(sec.id,m,mine,!mine.length)) }
      if(spare){const b=el("button","spare-btn",showSpare.has(sec.id)?"收起空的機台":"＋ 顯示空的機台（"+spare+"）"); b.dataset.spare=sec.id; lanes.append(b)}
      box.append(lanes);
    }
    board.append(box);
  }
  $("summary").textContent="符合 "+rows.length+" 張・計畫單平台（五股廠）共 "+orders.length+" 張・已填 "+saved.size+" 張";
}
$("board").addEventListener("click",e=>{
  const sp=e.target.closest("[data-spare]"); if(sp){const id=sp.dataset.spare; showSpare.has(id)?showSpare.delete(id):showSpare.add(id); renderBoard(); return}
  const h=e.target.closest(".bsec-h"); if(!h||h.closest(".bsec").classList.contains("empty")) return;
  const id=h.dataset.sec; collapsed.has(id)?collapsed.delete(id):collapsed.add(id); store.set("collapsed",[...collapsed]); renderBoard();
});
$("board").addEventListener("keydown",e=>{const c=e.target.closest?.(".card"); if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openEditor(c.dataset.no)}});
function buildFilters(){
  const sel=$("machineFilter"), cur=sel.value; sel.length=1;
  for(const v of options["機台"]||[...new Set([...saved.values()].map(r=>r["機台"]).filter(Boolean))]) sel.append(new Option(v,v));
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:"";
}
let rt=null; for(const id of ["q","machineFilter","statusFilter"]) $(id).addEventListener("input",()=>{clearTimeout(rt);rt=setTimeout(renderBoard,id==="q"?250:0)});
$("reloadBtn").onclick=()=>start(true);

// Save a few fields of one work order (the others stay as they are on the server).
function saveFields(no,fields){
  pending.add(no);
  const p=queue.then(()=>post({action:"save",row:{工令單號:no,...fields}}));
  queue=p.catch(()=>{});
  return p.then(res=>{if(res) saved.set(no,res.row); return res}).finally(()=>pending.delete(no));
}

// ---- drag: press and move to pick a card up (a plain click opens it). The card follows the pointer, a dashed gap shows where it
// lands, empty machine lanes appear, and lanes / the page scroll when the pointer nears an edge. A section title is a drop target too.
let cd=null;
$("board").addEventListener("pointerdown",e=>{
  const c=e.target.closest(".card"); if(!c||e.button>0) return;
  cd={card:c,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,on:false,parent:c.parentNode,next:c.nextElementSibling,raf:0,overSec:null};
  window.addEventListener("pointermove",cardMove); window.addEventListener("pointerup",cardUp); window.addEventListener("pointercancel",cardUp);
});
function cardMove(e){
  if(!cd) return; cd.x=e.clientX; cd.y=e.clientY;
  if(!cd.on){ if(Math.hypot(cd.x-cd.sx,cd.y-cd.sy)<6) return;
    const b=cd.card.getBoundingClientRect(); cd.ox=cd.sx-b.left; cd.oy=cd.sy-b.top;
    cd.ghost=cd.card.cloneNode(true); cd.ghost.classList.add("ghost"); cd.ghost.style.width=b.width+"px"; document.body.append(cd.ghost);
    cd.card.classList.add("ph"); document.body.classList.add("dragging"); cd.on=true; edgeScroll();
  }
  e.preventDefault(); cd.ghost.style.left=(cd.x-cd.ox)+"px"; cd.ghost.style.top=(cd.y-cd.oy)+"px"; placeGap();
}
function placeGap(){
  const under=document.elementFromPoint(cd.x,cd.y);
  const head=under?.closest(".bsec-h"), sec=head?.closest(".bsec");
  for(const b of document.querySelectorAll(".bsec.over")) if(b!==sec) b.classList.remove("over");
  if(head&&(sec.classList.contains("empty")||collapsed.has(sec.dataset.sec))){sec.classList.add("over");cd.overSec=sec.dataset.sec;return}
  cd.overSec=null;
  const list=under?.closest(".cards")||under?.closest(".lane")?.querySelector(".cards"); if(!list) return;
  let before=null; for(const c of list.querySelectorAll(".card:not(.ph)")){const b=c.getBoundingClientRect(); if(cd.y<b.top+b.height/2){before=c;break}}
  if(before){if(cd.card.nextElementSibling!==before) list.insertBefore(cd.card,before)} else if(list.lastElementChild!==cd.card) list.append(cd.card);
}
function edgeScroll(){
  if(!cd||!cd.on) return;
  const lanes=document.elementFromPoint(cd.x,cd.y)?.closest(".lanes");
  if(lanes){const r=lanes.getBoundingClientRect(); if(cd.x<r.left+60) lanes.scrollLeft-=14; else if(cd.x>r.right-60) lanes.scrollLeft+=14}
  if(cd.y<70) window.scrollBy(0,-14); else if(cd.y>innerHeight-70) window.scrollBy(0,14);
  placeGap(); cd.raf=requestAnimationFrame(edgeScroll);
}
function cardUp(){
  const d=cd; cd=null; if(!d) return;
  window.removeEventListener("pointermove",cardMove); window.removeEventListener("pointerup",cardUp); window.removeEventListener("pointercancel",cardUp);
  if(!d.on){openEditor(d.card.dataset.no);return}
  cancelAnimationFrame(d.raf); d.ghost.remove(); d.card.classList.remove("ph"); document.body.classList.remove("dragging");
  for(const b of document.querySelectorAll(".bsec.over")) b.classList.remove("over");
  if(d.overSec) return moveToSection(d.card.dataset.no,d.overSec);
  if(d.card.parentNode===d.parent&&d.card.nextElementSibling===d.next){renderBoard();return}
  dropCard(d.card);
}
async function moveToSection(no,sec){                        // dropped on a section title: into that section's 等待安排
  const r=allRows().find(x=>x.no===no);
  if(r&&sectionOf(r)===sec&&!r.saved?.["機台"]){renderBoard();return}
  const res=await saveFields(no,{分區:sec,機台:""});
  if(!res) say("沒存成功，請重新讀取後再試。");
  collapsed.delete(sec); store.set("collapsed",[...collapsed]); renderBoard();
}
async function dropCard(c){
  const list=c.parentNode, sec=list.dataset.sec, mach=list.dataset.mach||"", no=c.dataset.no, r=allRows().find(x=>x.no===no);
  const sib=n=>n&&n.classList.contains("card")?n:null, prev=sib(c.previousElementSibling), next=sib(c.nextElementSibling);
  const kp=prev?keyOf.get(prev.dataset.no):null, kn=next?keyOf.get(next.dataset.no):null;
  let k=keyOf.get(no);
  if(kp!=null&&kn!=null) k=(kp+kn)/2; else if(kp!=null) k=kp+1000; else if(kn!=null) k=kn-1000;
  k=Math.round(k*1e6)/1e6;
  if((kp!=null&&k<=kp)||(kn!=null&&k>=kn)){                 // no room between the neighbours: renumber this lane
    const cards=[...list.querySelectorAll(".card")];
    for(let i=0;i<cards.length;i++){const n=cards[i].dataset.no,v=(i+1)*1000; keyOf.set(n,v); if(n!==no) saveFields(n,{排序:String(v)})}
    k=keyOf.get(no);
  }
  const fields={排序:String(k)};
  if(r&&sectionOf(r)!==sec) fields["分區"]=sec;
  if((r?.saved?.["機台"]||"")!==mach) fields["機台"]=mach;
  keyOf.set(no,k);
  const res=await saveFields(no,fields);
  if(!res) say("順序沒存成功，請重新讀取後再試。");
  renderBoard();
}

// ---- card editor: all hand-filled fields of one work order, saved as you change them ----
function makeInput(c, r){
  const k=c.k, v=r.saved?.[k]??""; let e;
  if(c.t==="select"&&options[c.opt]?.length){
    e=document.createElement("select"); e.append(new Option("",""));
    for(const o of options[c.opt]) e.append(new Option(o,o));
    if(v&&!options[c.opt].includes(v)) e.append(new Option(v,v));   // keep a saved value that left the dropdown list
    e.value=v;
  }else{
    e=document.createElement("input"); e.type=c.t==="number"?"number":c.t==="date"?"date":"text";
    if(c.t==="number") e.step="any";
    if(c.list) e.setAttribute("list","dl-"+k);
    e.value=v;
  }
  e.dataset.k=k; return e;
}
function collect(box){
  const row={}; for(const e of box.querySelectorAll("[data-k]")) row[e.dataset.k]=e.value.trim(); return row;
}
for(const c of FIELDS) if(c.list){const dl=el("datalist");dl.id="dl-"+c.k;for(const v of c.list)dl.append(new Option(v));document.body.append(dl)}
function openEditor(no){
  const r=allRows().find(x=>x.no===no); if(!r) return;
  const p=r.plan||{}, s=r.saved||{};
  const wrap=el("div","editor"), box=el("div","ed-box"); box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true");
  const head=el("div","ed-head"), title=el("div");
  title.append(el("h2","mono",no),el("div",null,p.name||s["產品名稱"]||""));
  const close=el("button","btn","關閉"); head.append(title,close); box.append(head);
  const info=el("div","ed-info"), item=(k,v)=>{const d=el("div");d.append(el("span",null,k),v||"—");info.append(d)};
  item("數量",(p.qty??s["數量"]??"")+" "+(p.unit??s["單位"]??"")); item("產品編號",p.code||s["產品編號"]); item("交期",p.due);
  item("到料時間",p.arrive); item("領料單號",p.pickNo); item("領料",p.picked?"✔ 已領料":"未領料"); item("工令完工",p.done?"✔ 完工":"未完工");
  if(p.parent) item("上階工單",p.parent); item("半成品完工",/^(TRUE|是)$/i.test(p.semi||"")?"✔":"");
  box.append(el("div","note","以下由計畫單平台帶出，要改請到計畫單平台"),info);
  const grid=el("div","ed-grid");
  for(const c of FIELDS){const lab=el("label"); lab.append(c.label||c.k,makeInput(c,r)); grid.append(lab)}
  const status=el("div","status"), actions=el("div","row-actions");
  if(r.saved){const clr=el("button","btn btn-stop","清除這張單填過的資料"); actions.append(clr);
    clr.onclick=async()=>{ if(!confirm("清除 "+no+" 填過的資料（機台、人員、進度等）？\n計畫單平台那邊不受影響，清除後無法復原。")) return;
      const res=await post({action:"remove",no}); if(!res) return; saved.delete(no); done(); say("已清除 "+no,"ok") }}
  box.append(grid,status,actions); wrap.append(box); document.body.append(wrap);
  grid.querySelector("select,input")?.focus();
  let t=null;
  grid.addEventListener("change",()=>{
    status.className="status"; status.textContent="…等待儲存"; clearTimeout(t);
    t=setTimeout(async()=>{status.textContent="儲存中…"; const res=await saveFields(no,collect(grid));
      if(res){status.className="status good"; status.textContent="✓ 已存 "+res.row["更新時間"].slice(5,16)} else {status.className="status bad"; status.textContent="⚠ 沒存成功"}},400);
  });
  const done=()=>{wrap.remove(); document.removeEventListener("keydown",esc); renderBoard()};
  const esc=e=>{if(e.key==="Escape") done()};
  close.onclick=done; wrap.addEventListener("click",e=>{if(e.target===wrap) done()}); document.addEventListener("keydown",esc);
}
window.addEventListener("beforeunload",e=>{if(pending.size) e.preventDefault()});   // do not lose edits that are still waiting to be saved

async function start(fresh){
  if(!API){say("還沒設定後端網址（config.js 的 sheetApi）。");return}
  if(!pin){showPin();return}
  say(fresh?"重新讀取計畫單平台中…（要等十幾秒）":"讀取計畫單平台中…（第一次可能要幾秒）","ok");
  const [o,b]=await Promise.all([get({action:"options"}),get({action:"board",...(fresh?{fresh:"1"}:{})})]);
  if(!o||!b) return;
  say(""); options=o.options||{}; if(options["機台"]) options["機台"]=options["機台"].filter(m=>!CAPSULE.test(m));
  orders=b.orders||[]; planOf=new Map(orders.map(x=>[x.no,x])); saved=new Map((b.rows||[]).map(r=>[r["工令單號"],r]));
  if(!Object.keys(options).length) say("下拉選項讀不到：請在 Apps Script 指令碼屬性加上 BKE_SHEET_ID。目前下拉欄位先用手打。");
  buildFilters(); $("listPanel").hidden=false; renderBoard();
}
start();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工廠管理</title>
<link rel="icon" href="icons/icon-192.png">
<style>
/* Desktop table for the 五股廠(生產組) sheet of BKE在途工單. Every work order of the plan sheet is a row. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d5dce3; --auto-bg:#eaf2fb;
  --accent:#f2c200; --go:#1d8a4c; --go-bg:#e2f3e9; --stop:#c43a2f; --warn-bg:#fff4cc; --warn-ink:#6b5200;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e6ebf0; --muted:#97a4b2; --line:#2c3843; --auto-bg:#1b2b3b;
  --go:#2fa866; --go-bg:#13301f; --stop:#e05547; --warn-bg:#3a3110; --warn-ink:#f3dc8a; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:14px;line-height:1.4;padding:12px}
.wrap{max-width:none;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
a{color:inherit}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px}
input:focus-visible,select:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.btn{cursor:pointer;font:inherit;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 14px;min-height:34px}
.btn-go{background:var(--go);border-color:var(--go);color:#fff}
.btn-mini{font-size:12px;font-weight:600;padding:2px 8px;min-height:24px;color:var(--stop);border-color:var(--stop)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:8px 12px;border-radius:8px;font-weight:600}
.msg.err{background:var(--warn-bg);color:var(--warn-ink)}
.msg.ok{background:var(--go-bg);color:var(--go)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{width:240px}
.note{font-size:13px;color:var(--muted);margin:0}
.legend{display:inline-block;padding:0 8px;border-radius:4px;background:var(--auto-bg);border:1px solid var(--line)}
.tablewrap{overflow:auto;max-height:calc(100vh - 190px);border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
th,td{padding:3px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle;white-space:nowrap;background:var(--surface)}
th{position:sticky;top:0;z-index:2;font-size:12px;color:var(--muted);font-weight:600;text-align:left}
th.auto{background:var(--auto-bg)}
td.auto{background:var(--auto-bg)}
.s0,.s1{position:sticky;z-index:1}
th.s0,th.s1{z-index:4}
.s0{left:0;min-width:124px;max-width:124px}
.s1{left:124px;min-width:210px;max-width:210px;overflow:hidden;text-overflow:ellipsis}
tr.saved td.s0{box-shadow:inset 3px 0 0 var(--go)}
tr.done td{opacity:.6}
td select{width:100%;min-width:84px}
td input[type=text],td input[type=number],td input[type=date]{width:100%;min-width:84px}
td input[type=number]{min-width:64px;width:72px}
td input[type=checkbox]{width:18px;height:18px;min-height:0}
td.chk{text-align:center}
.status{min-width:96px;font-size:12px;color:var(--muted)}
.status.bad{color:var(--stop);font-weight:700}
.status.good{color:var(--go)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>工廠管理 <small class="note">五股廠(生產組)・粉包</small></h1>
    <a href="index.html">← 掃碼 App</a>
  </header>

  <section class="panel" id="pinPanel" hidden>
    <label for="pinInput">請輸入工廠密碼（和掃碼 App 同一組，只需輸入一次）</label>
    <div class="row-actions"><input id="pinInput" type="password" autocomplete="off" style="max-width:240px"><button class="btn btn-go" id="pinGo">確定</button></div>
  </section>

  <div id="msg" class="msg" hidden></div>

  <section class="panel" id="listPanel" hidden>
    <div class="tools">
      <input id="q" type="search" placeholder="搜尋工令單號、品名、人員">
      <select id="itemFilter" aria-label="品項"><option value="__transit">在途品項（預設）</option><option value="">全部品項</option></select>
      <select id="machineFilter" aria-label="機台"><option value="">全部機台</option></select>
      <select id="statusFilter" aria-label="狀態">
        <option value="open">未完工</option><option value="all">全部</option>
        <option value="unassigned">還沒排機台</option><option value="assigned">已排機台</option><option value="done">已完工</option>
      </select>
      <button class="btn" id="reloadBtn">重新讀取</button>
      <span class="note" id="summary"></span>
    </div>
    <p class="note"><span class="legend">淺藍底</span> ＝ 自動帶出，不用填（產品、數量等來自訂單計畫單；人數＝選了幾位作業人員）。其他欄位直接在表格裡選或填，改完會自動存檔。</p>
    <div class="tablewrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="row-actions"><button class="btn" id="moreBtn" hidden>顯示更多</button></div>
  </section>
</div>

<script src="config.js"></script>
<script>
const API = window.APP_CONFIG?.sheetApi || "";
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const $ = id => document.getElementById(id);
// Column order. auto: filled from the plan sheet (not typed). Dropdown lists (opt) come from the backend because they hold staff names.
const COLS = [
  {id:"no", label:"工令單號", auto:true, s:0},
  {id:"name", label:"產品名稱", auto:true, s:1},
  {id:"qty", label:"數量", auto:true},
  {id:"item", label:"品項", auto:true},
  {k:"機台", t:"select", opt:"機台"},
  {k:"作業人員1", label:"作業人員 1", t:"select", opt:"作業人員"},
  {k:"作業人員2", label:"作業人員 2", t:"select", opt:"作業人員"},
  {k:"作業人員3", label:"作業人員 3", t:"select", opt:"作業人員"},
  {k:"作業人員4", label:"作業人員 4", t:"select", opt:"作業人員"},
  {id:"people", label:"人數", auto:true},
  {k:"預計完工日", t:"select", opt:"預計完工日"},
  {k:"天/時", t:"select", opt:"天/時"},
  {k:"進度說明", t:"select", opt:"進度說明"},
  {k:"製造日期", t:"date"},
  {k:"生產進度", t:"number"},
  {k:"完工時間", t:"date"},
  {k:"實際用時(時)", label:"用時(時)", t:"number"},
  {k:"實際用時(分)", label:"用時(分)", t:"number"},
  {k:"到料時間", t:"text", plan:"arrive"},
  {k:"領料", t:"check"},
  {k:"工令完工", t:"check"},
  {k:"答交", t:"text"},
  {k:"作業時間", t:"text"},
  {k:"領料單號/調撥單號", label:"領料單號/調撥單號", t:"text", upper:true},
  {k:"出貨點", t:"text", list:["出貨客戶","五股包裝"]},
  {k:"交期", t:"text"},
  {id:"code", label:"產品編號", auto:true},
  {k:"備註", t:"text", wide:true},
  {id:"status", label:"狀態"},
];
let pin = store.get("pin",""), options = {}, orders = [], saved = new Map(), limit = 100, queue = Promise.resolve();
const timers = new Map(), pending = new Set();
// 品項 that actually appear in the 五股廠(生產組) sheet (checked 2026-10-14 against 訂單計畫單: 289 of 777 orders; packaging items such as 盒/袋裝/5包裝 never do).
const TRANSIT_ITEMS = ["7混料","4三面封粉包","4粉包","4打排","4膠囊","2換膠囊","4液瓶"];

function say(text, cls="err"){const m=$("msg");m.className="msg "+cls;m.textContent=text;m.hidden=!text}
const ERR = {bad_pin:"工廠密碼不正確。", not_configured:"後端還沒設定密碼。", bad_format:"工令單號格式不對。", not_found:"訂單計畫單查不到這個工令單號。", row_missing:"這筆資料已經不存在，請重新整理。", bad_request:"送出的資料有問題。"};
async function request(fn){
  try{
    const res = await fn();
    if(res.ok) return res;
    if(res.error==="bad_pin"){store.set("pin","");pin="";showPin()}
    say(ERR[res.error]||"發生錯誤："+res.error); return null;
  }catch(e){say("連不上伺服器，請確認網路後再試。"); return null}
}
const get = params => request(async()=>(await fetch(API+"?"+new URLSearchParams({pin,...params}))).json());
// text/plain keeps this a "simple" request, so the browser needs no CORS preflight against Apps Script
const post = body => request(async()=>(await fetch(API,{method:"POST",body:JSON.stringify({pin,...body})})).json());

function showPin(){$("pinPanel").hidden=false;$("listPanel").hidden=true;$("pinInput").focus()}
$("pinGo").onclick=()=>{const v=$("pinInput").value.trim();if(!v)return;pin=v;store.set("pin",v);$("pinInput").value="";$("pinPanel").hidden=true;say("");start()};
$("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("pinGo").click()});

// ---- rows ----
const done = r => !!r && (r["工令完工"]==="是"||r["進度說明"]==="完工");
function allRows(){
  const seen=new Set(), out=[];
  for(const o of orders){if(seen.has(o.no))continue;seen.add(o.no);out.push({no:o.no,plan:o,saved:saved.get(o.no)||null})}
  for(const [no,r] of saved) if(!seen.has(no)) out.push({no,plan:null,saved:r});   // saved earlier, order has left the plan sheet
  return out.sort((a,b)=>b.no.slice(1).localeCompare(a.no.slice(1))||a.no.localeCompare(b.no));  // newest orders first
}
const peopleOf = r => [1,2,3,4].map(i=>r?.["作業人員"+i]).filter(Boolean);
function visibleRows(){
  const q=$("q").value.trim().toLowerCase(), item=$("itemFilter").value, mc=$("machineFilter").value, st=$("statusFilter").value;
  return allRows().filter(r=>{
    const s=r.saved;
    if(item==="__transit"){if(!s&&!TRANSIT_ITEMS.includes(r.plan?.item)) return false}   // rows already filled in stay visible
    else if(item&&r.plan?.item!==item) return false;
    if(mc&&s?.["機台"]!==mc) return false;
    if(st==="open"&&done(s)) return false;
    if(st==="done"&&!done(s)) return false;
    if(st==="unassigned"&&s?.["機台"]) return false;
    if(st==="assigned"&&!s?.["機台"]) return false;
    if(!q) return true;
    return [r.no,r.plan?.name||s?.["產品名稱"],r.plan?.code,peopleOf(s).join(" ")].join(" ").toLowerCase().includes(q);
  });
}

function makeInput(c, r){
  const k=c.k; let v=r.saved?.[k]??""; if(!v&&c.plan) v=r.plan?.[c.plan]||"";
  let el;
  if(c.t==="select"&&options[c.opt]?.length){
    el=document.createElement("select"); el.append(new Option("",""));
    for(const o of options[c.opt]) el.append(new Option(o,o));
    if(v&&!options[c.opt].includes(v)) el.append(new Option(v,v));   // keep a saved value that left the dropdown list
    el.value=v;
  }else if(c.t==="check"){
    el=document.createElement("input"); el.type="checkbox"; el.checked=v==="是";
  }else{
    el=document.createElement("input"); el.type=c.t==="number"?"number":c.t==="date"?"date":"text";
    if(c.t==="number") el.step="any";
    if(c.upper) el.style.textTransform="uppercase";
    if(c.list){el.setAttribute("list","dl-"+k)}
    el.value=v;
  }
  el.dataset.k=k; if(c.t==="check") el.setAttribute("aria-label",k);
  return el;
}
function buildRow(r){
  const tr=document.createElement("tr"); tr.dataset.no=r.no; if(r.saved) tr.className="saved"; if(done(r.saved)) tr.classList.add("done");
  const name=r.plan?.name||r.saved?.["產品名稱"]||"", code=r.plan?.code||r.saved?.["產品編號"]||"";
  const qty=(r.plan?.qty??r.saved?.["數量"]??"")+" "+(r.plan?.unit??r.saved?.["單位"]??"");
  for(const c of COLS){
    const td=document.createElement("td"); if(c.auto) td.classList.add("auto"); if(c.s!=null) td.classList.add("s"+c.s);
    if(c.id==="no"){td.className+=" mono";td.textContent=r.no;if(r.plan?.rework){const t=document.createElement("small");t.textContent=" 重工";t.style.color="#b54708";td.append(t)}}
    else if(c.id==="name"){td.textContent=name;td.title=name}
    else if(c.id==="qty"){td.textContent=qty.trim();td.style.textAlign="right"}
    else if(c.id==="item") td.textContent=r.plan?.item||"";
    else if(c.id==="code"){td.className+=" mono";td.textContent=code}
    else if(c.id==="people"){td.dataset.people="1";td.style.textAlign="center";td.textContent=peopleOf(r.saved).length||""}
    else if(c.id==="status"){td.className+=" status";setStatus(td,r.saved?"good":"",r.saved?"✓ 已存 "+r.saved["更新時間"].slice(5,16):"");
      if(r.saved){const b=document.createElement("button");b.className="btn btn-mini";b.textContent="清除";b.title="清除這張單填過的資料（訂單計畫單不受影響）";b.dataset.clear=r.no;td.append(" ",b)}}
    else{td.append(makeInput(c,r)); if(c.t==="check") td.classList.add("chk")}
    tr.append(td);
  }
  return tr;
}
function setStatus(td,cls,text){td.className="status"+(cls?" "+cls:"");td.textContent=text}

function render(){
  const rows=visibleRows(), body=$("rows"); body.textContent="";
  const frag=document.createDocumentFragment(); for(const r of rows.slice(0,limit)) frag.append(buildRow(r)); body.append(frag);
  $("summary").textContent="顯示 "+Math.min(limit,rows.length)+" / 符合 "+rows.length+" 張・訂單計畫單共 "+orders.length+" 張・已填 "+saved.size+" 張";
  $("moreBtn").hidden=rows.length<=limit; $("moreBtn").textContent="顯示更多（還有 "+(rows.length-limit)+" 張）";
}
function buildHead(){
  const h=$("head"); h.textContent="";
  for(const c of COLS){const th=document.createElement("th"); th.textContent=c.label||c.k; if(c.auto) th.classList.add("auto"); if(c.s!=null) th.classList.add("s"+c.s); h.append(th)}
  for(const c of COLS) if(c.list&&!document.getElementById("dl-"+c.k)){const dl=document.createElement("datalist");dl.id="dl-"+c.k;for(const v of c.list)dl.append(new Option(v));document.body.append(dl)}
}
function buildFilters(){
  const fill=(sel,vals,keep=1)=>{const cur=sel.value;sel.length=keep;for(const v of vals)sel.append(new Option(v,v));sel.value=cur&&[...sel.options].some(o=>o.value===cur)?cur:sel.options[0].value};
  fill($("itemFilter"),[...new Set(orders.map(o=>o.item).filter(Boolean))].sort(),2);
  fill($("machineFilter"),options["機台"]||[...new Set([...saved.values()].map(r=>r["機台"]).filter(Boolean))]);
}
let rt=null; for(const id of ["q","itemFilter","machineFilter","statusFilter"]) $(id).addEventListener("input",()=>{clearTimeout(rt);limit=100;rt=setTimeout(render,id==="q"?250:0)});
$("moreBtn").onclick=()=>{limit+=100;render()};
$("reloadBtn").onclick=()=>start();

// ---- editing: every change saves its row (rows are keyed by 工令單號) ----
function collect(tr){
  const row={};
  for(const el of tr.querySelectorAll("[data-k]")) row[el.dataset.k]=el.type==="checkbox"?(el.checked?"是":""):el.value.trim();
  if(row["領料單號/調撥單號"]) row["領料單號/調撥單號"]=row["領料單號/調撥單號"].toUpperCase();
  return row;
}
function updatePeople(tr){
  const n=[...tr.querySelectorAll('[data-k^="作業人員"]')].filter(e=>e.value).length;
  tr.querySelector("[data-people]").textContent=n||"";
}
function statusCell(tr){return tr.querySelector("td.status")}
function schedule(tr){
  const no=tr.dataset.no; setStatus(statusCell(tr),"","…等待儲存"); clearTimeout(timers.get(no)); pending.add(no);
  timers.set(no,setTimeout(()=>{queue=queue.then(()=>saveRow(tr)).finally(()=>pending.delete(no))},500));
}
async function saveRow(tr){
  const no=tr.dataset.no, td=statusCell(tr); setStatus(td,"","儲存中…");
  const res=await post({action:"save",row:{工令單號:no,...collect(tr)}});
  if(!res){setStatus(td,"bad","⚠ 沒存成功");const b=document.createElement("button");b.className="btn btn-mini";b.textContent="重試";b.onclick=()=>schedule(tr);td.append(" ",b);return}
  saved.set(no,res.row); tr.classList.add("saved"); tr.classList.toggle("done",done(res.row));
  tr.querySelector("[data-people]").textContent=res.row["人數"]||"";
  setStatus(td,"good","✓ 已存 "+res.row["更新時間"].slice(5,16));
  const b=document.createElement("button");b.className="btn btn-mini";b.textContent="清除";b.dataset.clear=no;td.append(" ",b);
  say(""); $("summary").textContent=$("summary").textContent.replace(/已填 \d+ 張/,"已填 "+saved.size+" 張");
}
$("rows").addEventListener("change",e=>{
  const tr=e.target.closest("tr"); if(!tr||!e.target.dataset.k) return;
  if(/^作業人員/.test(e.target.dataset.k)) updatePeople(tr);
  schedule(tr);
});
$("rows").addEventListener("click",async e=>{
  const no=e.target.dataset?.clear; if(!no) return;
  if(!confirm("清除 "+no+" 填過的資料（機台、人員、進度等）？\n訂單計畫單那邊不受影響，清除後無法復原。")) return;
  const res=await post({action:"remove",no}); if(!res) return;
  saved.delete(no); const tr=e.target.closest("tr"); const r=allRows().find(x=>x.no===no);
  if(r) tr.replaceWith(buildRow(r)); else tr.remove();
  render(); say("已清除 "+no,"ok");
});
window.addEventListener("beforeunload",e=>{if(pending.size) e.preventDefault()});   // do not lose edits that are still waiting to be saved

async function start(){
  if(!API){say("還沒設定後端網址（config.js 的 sheetApi）。");return}
  if(!pin){showPin();return}
  say("讀取訂單計畫單中…（第一次可能要幾秒）","ok");
  const [o,b]=await Promise.all([get({action:"options"}),get({action:"board"})]);
  if(!o||!b) return;
  say(""); options=o.options||{}; orders=b.orders||[]; saved=new Map((b.rows||[]).map(r=>[r["工令單號"],r]));
  if(!Object.keys(options).length) say("下拉選項讀不到：請在 Apps Script 指令碼屬性加上 BKE_SHEET_ID。目前下拉欄位先用手打。");
  buildHead(); buildFilters(); $("listPanel").hidden=false; render();
}
start();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
